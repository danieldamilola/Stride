<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOCUS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      background: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .focus-text {
      color: var(--white);
      font-size: 120px;
      font-weight: 700;
      letter-spacing: 20px;
      text-align: center;
      user-select: none;
      animation: fadeIn 1s ease-in;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @media (max-width: 768px) {
      .focus-text {
        font-size: 80px;
        letter-spacing: 10px;
      }
    }
    
    @media (max-width: 480px) {
      .focus-text {
        font-size: 60px;
        letter-spacing: 5px;
      }
    }
  </style>


</head>
<body>
  <main class="focus-message"><h1>Focus blocked this page</h1><p><strong>{{BLOCKED_HOST}}</strong></p><p>Your locked Focus rules block this domain. They include saved domains and the adult-content and Telegram blocklists.</p><button type="button" onclick="history.back()">Go back</button><button type="button" onclick="window.chrome.webview.postMessage('{{IPC_TOKEN}}:open:internal://newtab')">Open a new tab</button></main>
</body>
</html>
