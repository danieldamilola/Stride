<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab - Stride</title>
    <style>
        :root { --accent: {{ACCENT}}; --accent-rgb: {{ACCENT_RGB}}; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111113;
            color: #E8E4DF;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 22vh;
            gap: 0;
            opacity: 0;
            animation: fadeSlideUp 400ms ease-out 100ms forwards;
        }

        /* ── Search — clean, single border, no decoration ── */
        .search-container {
            width: 460px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 8px;
            border: 1px solid #2A2A2E;
            background: #1A1A1E;
            color: #E8E4DF;
            font-size: 14px;
            font-weight: 300;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            outline: none;
            transition: border-color 200ms ease;
            cursor: text;
        }

        .search-input:focus {
            border-color: rgba(var(--accent-rgb),0.35);
        }

        .search-input::placeholder {
            color: #4A4844;
            font-weight: 300;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: #4A4844;
            pointer-events: none;
        }

        /* ── Shortcut Tiles ── */
        .shortcut-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 24px;
            max-width: 580px;
        }

        .shortcut-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: #1A1A1E;
            border: 1px solid #2A2A2E;
            cursor: pointer;
            transition: background 150ms ease, border-color 150ms ease;
            position: relative;
            text-decoration: none;
            outline: none;
        }

        .shortcut-tile:hover {
            background: #222226;
            border-color: #3A3A3E;
        }

        .shortcut-tile:focus-visible {
            border-color: rgba(var(--accent-rgb), 0.5);
            background: #222226;
        }

        .shortcut-tile img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            margin-bottom: 6px;
            pointer-events: none;
        }

        .shortcut-tile .tile-name {
            font-size: 11px;
            font-weight: 400;
            color: #B0ACA6;
            max-width: 68px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1;
            pointer-events: none;
        }

        .shortcut-tile .tile-remove {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #333338;
            border: none;
            color: #8A8680;
            font-size: 10px;
            line-height: 16px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 120ms ease;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shortcut-tile:hover .tile-remove {
            opacity: 1;
        }

        .shortcut-tile .tile-remove:hover {
            background: var(--accent);
            color: #111113;
        }

        .shortcut-add {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: transparent;
            border: 1px dashed #2A2A2E;
            cursor: pointer;
            transition: border-color 150ms ease, background 150ms ease;
            outline: none;
        }

        .shortcut-add:hover {
            border-color: rgba(var(--accent-rgb),0.35);
            background: rgba(var(--accent-rgb),0.04);
        }

        .shortcut-add svg {
            width: 18px;
            height: 18px;
            color: #4A4844;
            transition: color 150ms ease;
        }

        .shortcut-add:focus-visible {
            border-color: rgba(var(--accent-rgb), 0.5);
            background: rgba(var(--accent-rgb), 0.04);
        }

        .shortcut-add:hover svg,
        .shortcut-add:focus-visible svg {
            color: var(--accent);
        }

        /* ── Add Dialog ── */
        .dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .dialog-overlay.open {
            display: flex;
        }

        .dialog {
            background: #1A1A1E;
            border: 1px solid #2A2A2E;
            border-radius: 12px;
            padding: 24px;
            width: 340px;
            animation: fadeSlideUp 200ms ease-out forwards;
        }

        .dialog h3 {
            font-size: 14px;
            font-weight: 500;
            color: #E8E4DF;
            margin-bottom: 16px;
        }

        .dialog label {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: #8A8680;
            margin-bottom: 4px;
        }

        .dialog input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #2A2A2E;
            background: #111113;
            color: #E8E4DF;
            font-size: 13px;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 200ms ease;
        }

        .dialog input:focus {
            border-color: rgba(var(--accent-rgb),0.35);
        }

        .dialog input::placeholder {
            color: #4A4844;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .dialog-actions button {
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid #2A2A2E;
            background: #1A1A1E;
            color: #8A8680;
            font-size: 12px;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            cursor: pointer;
            transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
        }

        .dialog-actions button:hover {
            background: #222226;
            color: #E8E4DF;
        }

        .dialog-actions button.primary {
            background: rgba(var(--accent-rgb),0.12);
            border-color: rgba(var(--accent-rgb),0.25);
            color: var(--accent);
        }

        .dialog-actions button.primary:hover {
            background: rgba(var(--accent-rgb),0.2);
        }

        /* ── Keyboard Shortcuts — barely visible, functional ── */
        .shortcuts {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        .shortcut {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 400;
            color: #4A4844;
            cursor: default;
        }

        .shortcut kbd {
            padding: 1px 5px;
            font-size: 10px;
            font-family: 'Inter', monospace;
            font-weight: 500;
            color: #8A8680;
            background: #1A1A1E;
            border: 1px solid #2A2A2E;
            border-radius: 3px;
        }

        /* ── Animations ── */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; }
        }
    </style>

<body>
    <div class="content">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAD50lEQVR4AbxXaWxNaRh+zk0zRjKSc29mGKMjDGaaDqmIWkIINzSKSMQWa2ii9ia22hIRErvYooj2ByGp2IqoEkSClIqQWhoqrVbtmv6g1482x/t87vnc3tvTe3Dr5rzf93zPuz2n39nqQdjP5zNneL3e816v+V7MipFJLe951g5rBy3ANM3upmnetCxkA1aKBPrEYnVILSuFtdlDrLtdWAkgYRi4JNbLdjTXzB5il9iTPZQAAfvERKWMP+dgL/aEh/siipr9zMPPiz3Z22NZxrhw589as7dsgZXstmHPHklYMCcN61ZnImfvNhTkHcHhnN1o+2drtyXC4qxkEQDuR5gjcpkhjXduWYsJY0Zh8MB+SPi3M1q1+g0dO7RH3949IxPcMT6Pm7jcg3sxXhqHxtbV1eFJaRk2b8/Cibxzoa5vwlEFZO3YgL/j/9JFrxcWIX1BJlJHT8G0mRk4eTpf+74HNClgZOoQJHVL1HVXrdmIJSvWovj+I3z48FHzPwIcBXRNTMDyxfN17RmzFuLy1et6HSvgKMA/qL/ukXe2ACWPS/U6lsBRQOitlX/hckTPuLg4cItoxBEBLglnAW3a6BKlT8s1JmDD7Kytaou4TcTk6Au1Fi1+Qad/OsDnNUPpBthZQPDhUlFZhdpAoEHSsKGD0KVTR80Rk9NEEKSm+HHowE6cPX4wyEROjgIsy1LR9fX1av6eITGhi05rH99O41DgKKDq5SsVxyddy5a/KmwP+Reu4MnTMnupMDlNBEFSt/8Vqq0NoOJ5lcLhg6OAFy9f69jOso96IYBPwbTZi7B+yy5lxOTEpY+uif8hvl1btW7qDnIU8ObtO5XMYeqksZwaGBueOXcRNOIGTllMm/z1JVtWXiFM44ejgBuFt3VGvz7J6gWkiSiALyvm2GFXrxXaMGJ2FHD7zj3kHsvTCXwF8w2oCQfAGMbabtZgLXsdPjsKYOCOPdmofP6CUBm/ATIXzgUf04oIGcjRxxibZi5r2OvG5iYFMGH81Fm4V/wQ9m/UiBTs370Jp3JzsGblYmXE5Oiz45jDXHvtNEcVwMTZGcvU1U5sW+s/fscQ/wBlxDbPmXcHc4ijGQVURwuin1f7zHlL1fu/+EEJAoFPpJURk+O3AWMYqxzRh2oRYBRFj/sScf9hifoCSp+/FP7h4zBx+lxlxOQ2y9cRY75EuxmNIo9hWEfdhDYWU/6sErTGfG449vZUV9fkyGP/lpuEWMawJ3vLFqiy6TK6uhYkLhYHe7EnlICampq7osgv1ux/CfYQ87Mnz0QJICAh1lv+ZUoDjAIAVCnTjx3BbKllFLA2e4jdDfL4DAAA///AhAxQAAAABklEQVQDAKYgZwIinfcbAAAAAElFTkSuQmCC"
             alt="Stride" style="width: 40px; height: 40px; opacity: 0.25; margin-bottom: 24px;">
        <div class="search-container">
            <input type="text" class="search-input"
                   placeholder="Search or type a URL"
                   autofocus
                   onkeydown="if(event.key==='Enter'){window.chrome.webview.postMessage(__T+'search:'+this.value)}">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.2" y1="16.2" x2="21" y2="21"/>
            </svg>
        </div>
        <div class="shortcut-grid" id="shortcutGrid"></div>
        <div class="shortcuts">
            <span class="shortcut"><kbd>Ctrl</kbd><kbd>L</kbd> URL</span>
            <span class="shortcut"><kbd>Ctrl</kbd><kbd>T</kbd> Tab</span>
            <span class="shortcut"><kbd>Ctrl</kbd><kbd>H</kbd> History</span>
        </div>
    </div>

    <!-- Add Shortcut Dialog -->
    <div class="dialog-overlay" id="dialogOverlay">
        <div class="dialog">
            <h3>Add shortcut</h3>
            <label for="scName">Name</label>
            <input type="text" id="scName" placeholder="YouTube" maxlength="24" autofocus>
            <label for="scUrl">URL</label>
            <input type="text" id="scUrl" placeholder="https://youtube.com">
            <div class="dialog-actions">
                <button onclick="closeDialog()">Cancel</button>
                <button class="primary" onclick="saveShortcut()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const __T = '{{IPC_TOKEN}}:';
        const shortcuts = JSON.parse('{{SHORTCUTS}}' || '[]');

        function getDomain(url) {
            try { return new URL(url).hostname; } catch { return url; }
        }

        function renderShortcuts() {
            const grid = document.getElementById('shortcutGrid');
            grid.innerHTML = '';

            shortcuts.forEach((sc, i) => {
                const tile = document.createElement('div');
                tile.className = 'shortcut-tile';
                tile.tabIndex = 0;
                tile.title = sc.Url || sc.url;

                const url = sc.Url || sc.url || '';
                const name = sc.Name || sc.name || '';
                const domain = getDomain(url);

                tile.innerHTML = `
                    <img src="https://icons.duckduckgo.com/ip3/${domain}.ico"
                         onerror="this.style.display='none'" alt="">
                    <span class="tile-name">${name}</span>
                    <button class="tile-remove" data-index="${i}" onclick="event.stopPropagation();removeShortcut(${i})" tabindex="-1">&times;</button>
                `;

                tile.addEventListener('click', () => {
                    window.chrome.webview.postMessage(__T+'shortcut-click:' + url);
                });
                tile.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        window.chrome.webview.postMessage(__T+'shortcut-click:' + url);
                    }
                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        e.preventDefault();
                        removeShortcut(i);
                    }
                });

                grid.appendChild(tile);
            });

            // Add button (max 16 shortcuts)
            if (shortcuts.length < 16) {
                const add = document.createElement('div');
                add.className = 'shortcut-add';
                add.tabIndex = 0;
                add.title = 'Add shortcut';
                add.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
                add.addEventListener('click', openDialog);
                add.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDialog(); }
                });
                grid.appendChild(add);
            }
        }

        function openDialog() {
            document.getElementById('scName').value = '';
            document.getElementById('scUrl').value = '';
            document.getElementById('dialogOverlay').classList.add('open');
            setTimeout(() => document.getElementById('scName').focus(), 50);
        }

        function closeDialog() {
            document.getElementById('dialogOverlay').classList.remove('open');
        }

        function saveShortcut() {
            const name = document.getElementById('scName').value.trim();
            let url = document.getElementById('scUrl').value.trim();
            if (!url) return;

            // Auto-prefix https if no protocol
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

            const payload = JSON.stringify({ name: name || getDomain(url), url: url });
            window.chrome.webview.postMessage(__T+'shortcut-add:' + payload);
            closeDialog();
        }

        function removeShortcut(index) {
            window.chrome.webview.postMessage(__T+'shortcut-remove:' + index);
        }

        // Dialog keyboard handling
        document.getElementById('dialogOverlay').addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDialog();
            if (e.key === 'Enter') saveShortcut();
        });

        // Close dialog on overlay click
        document.getElementById('dialogOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeDialog();
        });

        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('dialogOverlay');
            if (overlay.classList.contains('open')) return;
            const input = document.querySelector('.search-input');
            if (document.activeElement !== input && !e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1) {
                input.focus();
            }
        });

        renderShortcuts();
    </script>
</body>
</html>
