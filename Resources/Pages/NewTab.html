<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab - Stride</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111113;
            color: #E8E4DF;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 22vh;
            gap: 0;
            opacity: 0;
            animation: fadeSlideUp 400ms ease-out 100ms forwards;
        }

        /* ── Search — clean, single border, no decoration ── */
        .search-container {
            width: 460px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 8px;
            border: 1px solid #2A2A2E;
            background: #1A1A1E;
            color: #E8E4DF;
            font-size: 14px;
            font-weight: 300;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            outline: none;
            transition: border-color 200ms ease;
            cursor: text;
        }

        .search-input:focus {
            border-color: rgba(212,165,116,0.35);
        }

        .search-input::placeholder {
            color: #4A4844;
            font-weight: 300;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: #4A4844;
            pointer-events: none;
        }

        /* ── Shortcuts — barely visible, functional ── */
        .shortcuts {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        .shortcut {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 400;
            color: #4A4844;
            cursor: default;
        }

        .shortcut kbd {
            padding: 1px 5px;
            font-size: 10px;
            font-family: 'Inter', monospace;
            font-weight: 500;
            color: #8A8680;
            background: #1A1A1E;
            border: 1px solid #2A2A2E;
            border-radius: 3px;
        }

        /* ── Animations ── */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; }
        }
    </style>

             alt="Stride" style="width: 40px; height: 40px; opacity: 0.25; margin-bottom: 24px;">
        <div class="search-container">
            <input type="text" class="search-input"
                   placeholder="Search or type a URL"
                   autofocus
                   onkeydown="if(event.key==='Enter'){window.chrome.webview.postMessage('search:'+this.value)}">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.2" y1="16.2" x2="21" y2="21"/>
            </svg>
        </div>
        <div class="shortcuts">
            <span class="shortcut"><kbd>Ctrl</kbd><kbd>L</kbd> URL</span>
            <span class="shortcut"><kbd>Ctrl</kbd><kbd>T</kbd> Tab</span>
            <span class="shortcut"><kbd>Ctrl</kbd><kbd>H</kbd> History</span>
        </div>
    </div>

    <script>
        document.addEventListener('keydown', (e) => {
            const input = document.querySelector('.search-input');
            if (document.activeElement !== input && !e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1) {
                input.focus();
            }
        });
    </script>
