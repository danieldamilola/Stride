<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab - Umber</title>
    <link rel="preload" as="image" href="{{BACKGROUND}}">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            height: 100%;
            background-color: var(--bg-base);
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-base);
            background-image: url('{{BACKGROUND}}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #E8E4DF;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .zoom-wrapper {
            zoom: {{ZOOM}}%;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            width: 100%;
        }

        /* ── Background Overlay to ensure text readability ── */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            opacity: 0;
            animation: fadeSlideUp 600ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            width: 100%;
            margin-top: 20vh; /* Moved to top */
        }

        /* ── Shortcut Tiles ── */
        .shortcut-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 36px;
            max-width: 640px;
            z-index: 5;
        }

        .shortcut-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 16px;
            background: rgba(20, 20, 24, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 250ms cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            text-decoration: none;
            outline: none;
        }

        .shortcut-tile:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .shortcut-tile:focus-visible {
            border-color: var(--focus-ring);
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
        }

        .shortcut-tile img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            margin-bottom: 8px;
            pointer-events: none;
            transition: transform 250ms ease;
        }

        .shortcut-tile:hover img {
            transform: scale(1.08);
        }

        .shortcut-tile .tile-name {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            max-width: 74px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .shortcut-tile .tile-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--border);
            border: 1px solid rgba(255,255,255,0.2);
            color: #E8E4DF;
            font-size: 14px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8);
            transition: all 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shortcut-tile:hover .tile-remove {
            opacity: 1;
            transform: scale(1);
        }

        .shortcut-tile .tile-remove:hover {
            background: var(--danger-surface);
            color: var(--danger-text);
            border-color: var(--danger-text);
        }

        .shortcut-add {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 16px;
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 250ms cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
        }

        .shortcut-add:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-4px);
        }

        .shortcut-add svg {
            width: 20px;
            height: 20px;
            color: rgba(255, 255, 255, 0.7);
            transition: color 250ms ease;
        }

        .shortcut-add:hover svg,
        .shortcut-add:focus-visible svg {
            color: #fff;
        }

        /* ── Keyboard Shortcuts ── */
        .shortcuts {
            position: fixed;
            bottom: 30px;
            display: flex;
            gap: 24px;
            opacity: 0;
            animation: fadeSlideUp 600ms cubic-bezier(0.2, 0.8, 0.2, 1) 300ms forwards;
            z-index: 10;
        }

        .shortcut {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            cursor: default;
        }

        .shortcut kbd {
            padding: 3px 6px;
            font-size: 10px;
            font-family: 'Outfit', monospace;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* ── Add Dialog ── */
        .dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 200ms ease;
        }

        .dialog-overlay.open {
            display: flex;
            opacity: 1;
        }

        .dialog {
            background: rgba(20, 20, 24, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 28px;
            width: 360px;
            transform: scale(0.95);
            transition: transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 24px 48px rgba(0,0,0,0.6);
        }

        .dialog-overlay.open .dialog {
            transform: scale(1);
        }

        .dialog h3 {
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 20px;
        }

        .dialog label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
        }

        .dialog input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 200ms ease;
        }

        .dialog input:focus {
            border-color: var(--focus-ring);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .dialog-actions button {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 200ms ease;
        }

        .dialog-actions button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .dialog-actions button.primary {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .dialog-actions button.primary:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* ── Animations ── */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
        .wallpapers-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(25, 25, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 200ms ease;
        }
        .wallpapers-btn:hover {
            background: rgba(40, 40, 48, 0.8);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .wallpapers-btn svg {
            width: 16px;
            height: 16px;
        }
    </style>


</head>
<body>
    <div class="bg-overlay"></div>

    <div class="zoom-wrapper">
        <div class="content">
            <div class="shortcut-grid" id="shortcutGrid"></div>
        </div>

        <div class="shortcuts">
            <span class="shortcut"><kbd>Ctrl</kbd><kbd>L</kbd> URL</span>
            <span class="shortcut"><kbd>Ctrl</kbd><kbd>T</kbd> Tab</span>
            <span class="shortcut"><kbd>Ctrl</kbd><kbd>H</kbd> History</span>
        </div>
    </div>

    <!-- Add Shortcut Dialog -->
    <div class="dialog-overlay" id="dialogOverlay">
        <div class="dialog">
            <h3>Add shortcut</h3>
            <label for="scName">Name</label>
            <input type="text" id="scName" placeholder="YouTube" maxlength="24" autofocus>
            <label for="scUrl">URL</label>
            <input type="text" id="scUrl" placeholder="https://youtube.com">
            <p class="dialog-error" id="shortcutError" role="alert"></p><div class="dialog-actions">
                <button onclick="closeDialog()">Cancel</button>
                <button class="primary" onclick="saveShortcut()">Save</button>
            </div>
        </div>
    </div>

    <button class="wallpapers-btn" onclick="openWallpapers()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        Choose wallpaper
    </button>

    <div class="dialog-overlay" id="wallpaperDialog"><div class="dialog"><h3>Choose wallpaper</h3><div class="wallpaper-grid" id="wallpaperGrid"></div><p class="dialog-error" id="wallpaperStatus" role="status"></p><div class="dialog-actions"><button onclick="window.chrome.webview.postMessage(__T+'open-backgrounds-folder')">Open wallpaper folder</button><button onclick="closeWallpapers()">Close</button></div></div></div>
    <script>
        const __T = '{{IPC_TOKEN}}:';
        let shortcuts = [];
        function updateShortcutsFromB64(b64) {
            try {
                if (!b64 || b64 === '{{SHORT'+'CUTS}}') return;
                const binStr = atob(b64);
                const bytes = new Uint8Array(binStr.length);
                for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                const text = new TextDecoder().decode(bytes);
                shortcuts = JSON.parse(text);
                renderShortcuts();
            } catch(e) { console.error("Failed to load shortcuts:", e); }
        }

        try {
            updateShortcutsFromB64('{{SHORTCUTS}}');
        } catch(e) {}

        function openWallpapers() {
            const grid = document.getElementById('wallpaperGrid');
            grid.replaceChildren();
            const urls = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('{{WALLPAPERS}}'), c => c.charCodeAt(0))));
            const status = document.getElementById('wallpaperStatus');
            status.textContent = urls.length ? 'Select an image to preview and save it.' : 'Add images to the wallpaper folder, then reload this page.';
            urls.forEach((url, i) => {
                const button = document.createElement('button'); button.className = 'wallpaper-choice'; button.setAttribute('aria-label','Use wallpaper ' + (i+1));
                const img = document.createElement('img'); img.src = url; img.alt = ''; button.append(img);
                button.onclick = () => { document.body.style.backgroundImage = 'url("' + url.replaceAll('"','%22') + '")'; window.chrome.webview.postMessage(__T+'setting:newTabBackground:'+encodeURIComponent(url)); status.textContent = 'Wallpaper selected.'; };
                grid.append(button);
            });
            document.getElementById('wallpaperDialog').classList.add('open');
        }
        function closeWallpapers() { document.getElementById('wallpaperDialog').classList.remove('open'); }
        function getDomain(url) {
            try { return new URL(url).hostname; } catch { return url; }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; });
        }

        function renderShortcuts() {
            const grid = document.getElementById('shortcutGrid');
            grid.innerHTML = '';

            shortcuts.forEach((sc, i) => {
                const tile = document.createElement('div');
                tile.className = 'shortcut-tile';
                tile.tabIndex = 0;
                tile.title = sc.Url || sc.url;

                const url = sc.Url || sc.url || '';
                const name = sc.Name || sc.name || '';
                const domain = getDomain(url);

                var safeName = escapeHtml(name);
                var safeDomain = escapeHtml(domain);
                tile.innerHTML = `
                    <img ${ {{FAVICON_PROXY}} ? 'src="https://icons.duckduckgo.com/ip3/' + safeDomain + '.ico"' : '' }
                         onerror="this.style.display='none'" alt="">
                    <span class="tile-name">${safeName}</span>
                    <button class="tile-remove" data-index="${i}" onclick="event.stopPropagation();removeShortcut(${i})" tabindex="-1">&times;</button>
                `;

                tile.addEventListener('click', () => {
                    window.chrome.webview.postMessage(__T+'shortcut-click:' + url);
                });
                tile.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        window.chrome.webview.postMessage(__T+'shortcut-click:' + url);
                    }
                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        e.preventDefault();
                        removeShortcut(i);
                    }
                });

                grid.appendChild(tile);
            });

            // Add button (max 10 shortcuts)
            if (shortcuts.length < 10) {
                const add = document.createElement('div');
                add.className = 'shortcut-add';
                add.tabIndex = 0;
                add.title = 'Add shortcut';
                add.setAttribute('role', 'button'); add.setAttribute('aria-label', 'Add shortcut');
                add.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
                add.addEventListener('click', openDialog);
                add.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDialog(); }
                });
                grid.appendChild(add);
            }
        }

        function openDialog() {
            document.getElementById('scName').value = '';
            document.getElementById('shortcutError').textContent = '';
            document.getElementById('scUrl').value = '';
            document.getElementById('dialogOverlay').classList.add('open');
            setTimeout(() => document.getElementById('scName').focus(), 100);
        }

        function closeDialog() {
            document.getElementById('dialogOverlay').classList.remove('open');
        }

        function saveShortcut() {
            const name = document.getElementById('scName').value.trim();
            let url = document.getElementById('scUrl').value.trim();
            const error = document.getElementById('shortcutError');
            if (!url) { error.textContent = 'Enter a website address.'; return; }

            // Auto-prefix https if no protocol
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

            try {
                const parsed = new URL(url);
                if (!['http:','https:'].includes(parsed.protocol) || !parsed.hostname || /\s/.test(parsed.hostname)) throw new Error();
                url = parsed.href;
            } catch { error.textContent = 'Enter a valid http or https website address.'; return; }
            const payload = JSON.stringify({ name: name || getDomain(url), url: url });
            window.chrome.webview.postMessage(__T+'shortcut-add:' + payload);
            closeDialog();
        }

        function removeShortcut(index) {
            window.chrome.webview.postMessage(__T+'shortcut-remove:' + index);
        }

        // Dialog keyboard handling
        document.getElementById('dialogOverlay').addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDialog();
            if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); saveShortcut(); }
        });

        // Close dialog on overlay click
        document.getElementById('dialogOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeDialog();
        });

        renderShortcuts();
    </script>
</body>
</html>
