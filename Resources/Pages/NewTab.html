<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab - Stride</title>
    <style>
        :root { --accent: {{ACCENT}}; --accent-rgb: {{ACCENT_RGB}}; }
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #111113;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #E8E4DF;
            font-family: 'Outfit', -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Background Overlay to ensure text readability ── */
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            opacity: 0;
            animation: fadeSlideUp 600ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            width: 100%;
            margin-top: 20vh; /* Moved to top */
        }

        /* ── Search — Glassmorphic ── */
        .search-container {
            width: 540px;
            position: relative;
            z-index: 10;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 48px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(20, 20, 24, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            color: #fff;
            font-size: 16px;
            font-weight: 400;
            font-family: inherit;
            outline: none;
            transition: all 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .search-input:focus {
            border-color: rgba(var(--accent-rgb), 0.6);
            background: rgba(20, 20, 24, 0.7);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 4px rgba(var(--accent-rgb), 0.15);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            transition: color 300ms ease;
        }

        .search-input:focus ~ .search-icon {
            color: var(--accent);
        }

        /* ── Shortcut Tiles ── */
        .shortcut-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 36px;
            max-width: 640px;
            z-index: 5;
        }

        .shortcut-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 16px;
            background: rgba(20, 20, 24, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 250ms cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            text-decoration: none;
            outline: none;
        }

        .shortcut-tile:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .shortcut-tile:focus-visible {
            border-color: rgba(var(--accent-rgb), 0.7);
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
        }

        .shortcut-tile img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            margin-bottom: 8px;
            pointer-events: none;
            transition: transform 250ms ease;
        }

        .shortcut-tile:hover img {
            transform: scale(1.08);
        }

        .shortcut-tile .tile-name {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            max-width: 74px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .shortcut-tile .tile-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #333338;
            border: 1px solid rgba(255,255,255,0.2);
            color: #E8E4DF;
            font-size: 14px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8);
            transition: all 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shortcut-tile:hover .tile-remove {
            opacity: 1;
            transform: scale(1);
        }

        .shortcut-tile .tile-remove:hover {
            background: var(--accent);
            color: #111113;
            border-color: var(--accent);
        }

        .shortcut-add {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 16px;
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 250ms cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
        }

        .shortcut-add:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-4px);
        }

        .shortcut-add svg {
            width: 20px;
            height: 20px;
            color: rgba(255, 255, 255, 0.7);
            transition: color 250ms ease;
        }

        .shortcut-add:hover svg,
        .shortcut-add:focus-visible svg {
            color: #fff;
        }

        /* ── Keyboard Shortcuts ── */
        .shortcuts {
            position: fixed;
            bottom: 30px;
            display: flex;
            gap: 24px;
            opacity: 0;
            animation: fadeSlideUp 600ms cubic-bezier(0.2, 0.8, 0.2, 1) 300ms forwards;
            z-index: 10;
        }

        .shortcut {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            cursor: default;
        }

        .shortcut kbd {
            padding: 3px 6px;
            font-size: 10px;
            font-family: 'Outfit', monospace;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* ── Add Dialog ── */
        .dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 200ms ease;
        }

        .dialog-overlay.open {
            display: flex;
            opacity: 1;
        }

        .dialog {
            background: rgba(20, 20, 24, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 28px;
            width: 360px;
            transform: scale(0.95);
            transition: transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 24px 48px rgba(0,0,0,0.6);
        }

        .dialog-overlay.open .dialog {
            transform: scale(1);
        }

        .dialog h3 {
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 20px;
        }

        .dialog label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
        }

        .dialog input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 200ms ease;
        }

        .dialog input:focus {
            border-color: rgba(var(--accent-rgb), 0.6);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .dialog-actions button {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 200ms ease;
        }

        .dialog-actions button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .dialog-actions button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #111113;
        }

        .dialog-actions button.primary:hover {
            filter: brightness(1.1);
        }

        /* ── Animations ── */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>

    <div class="content">
        <div class="search-container">
            <input type="text" class="search-input"
                   placeholder="Search the web or type a URL"
                   autofocus
                   onkeydown="if(event.key==='Enter'){window.chrome.webview.postMessage(__T+'search:'+this.value)}">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.2" y1="16.2" x2="21" y2="21"/>
            </svg>
        </div>
        <div class="shortcut-grid" id="shortcutGrid"></div>
    </div>

    <div class="shortcuts">
        <span class="shortcut"><kbd>Ctrl</kbd><kbd>L</kbd> URL</span>
        <span class="shortcut"><kbd>Ctrl</kbd><kbd>T</kbd> Tab</span>
        <span class="shortcut"><kbd>Ctrl</kbd><kbd>H</kbd> History</span>
    </div>

    <!-- Add Shortcut Dialog -->
    <div class="dialog-overlay" id="dialogOverlay">
        <div class="dialog">
            <h3>Add shortcut</h3>
            <label for="scName">Name</label>
            <input type="text" id="scName" placeholder="YouTube" maxlength="24" autofocus>
            <label for="scUrl">URL</label>
            <input type="text" id="scUrl" placeholder="https://youtube.com">
            <div class="dialog-actions">
                <button onclick="closeDialog()">Cancel</button>
                <button class="primary" onclick="saveShortcut()">Save</button>
            </div>
        </div>
    </div>

    <script>
        document.body.style.zoom = '{{ZOOM}}%';
        const __T = '{{IPC_TOKEN}}:';
        const shortcuts = JSON.parse('{{SHORTCUTS}}' || '[]');

        // Local high-quality backgrounds (instant load!)
        const BACKGROUNDS = [
            "https://local.assets/bg1.jpg",
            "https://local.assets/bg2.jpg",
            "https://local.assets/bg3.jpg"
        ];

        function initBackground() {
            // Pick a random background index from cache to avoid showing the same one twice in a row if possible
            let lastIdx = -1;
            try {
                lastIdx = parseInt(localStorage.getItem('stride_ntp_bg_idx') || '-1');
            } catch (e) {}

            let nextIdx = Math.floor(Math.random() * BACKGROUNDS.length);
            if (nextIdx === lastIdx && BACKGROUNDS.length > 1) {
                nextIdx = (nextIdx + 1) % BACKGROUNDS.length;
            }

            try {
                localStorage.setItem('stride_ntp_bg_idx', nextIdx.toString());
            } catch (e) {}

            document.body.style.backgroundImage = `url(${BACKGROUNDS[nextIdx]})`;
        }

        initBackground();

        function getDomain(url) {
            try { return new URL(url).hostname; } catch { return url; }
        }

        function renderShortcuts() {
            const grid = document.getElementById('shortcutGrid');
            grid.innerHTML = '';

            shortcuts.forEach((sc, i) => {
                const tile = document.createElement('div');
                tile.className = 'shortcut-tile';
                tile.tabIndex = 0;
                tile.title = sc.Url || sc.url;

                const url = sc.Url || sc.url || '';
                const name = sc.Name || sc.name || '';
                const domain = getDomain(url);

                tile.innerHTML = `
                    <img src="https://icons.duckduckgo.com/ip3/${domain}.ico"
                         onerror="this.style.display='none'" alt="">
                    <span class="tile-name">${name}</span>
                    <button class="tile-remove" data-index="${i}" onclick="event.stopPropagation();removeShortcut(${i})" tabindex="-1">&times;</button>
                `;

                tile.addEventListener('click', () => {
                    window.chrome.webview.postMessage(__T+'shortcut-click:' + url);
                });
                tile.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        window.chrome.webview.postMessage(__T+'shortcut-click:' + url);
                    }
                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        e.preventDefault();
                        removeShortcut(i);
                    }
                });

                grid.appendChild(tile);
            });

            // Add button (max 10 shortcuts)
            if (shortcuts.length < 10) {
                const add = document.createElement('div');
                add.className = 'shortcut-add';
                add.tabIndex = 0;
                add.title = 'Add shortcut';
                add.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
                add.addEventListener('click', openDialog);
                add.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDialog(); }
                });
                grid.appendChild(add);
            }
        }

        function openDialog() {
            document.getElementById('scName').value = '';
            document.getElementById('scUrl').value = '';
            document.getElementById('dialogOverlay').classList.add('open');
            setTimeout(() => document.getElementById('scName').focus(), 100);
        }

        function closeDialog() {
            document.getElementById('dialogOverlay').classList.remove('open');
        }

        function saveShortcut() {
            const name = document.getElementById('scName').value.trim();
            let url = document.getElementById('scUrl').value.trim();
            if (!url) return;

            // Auto-prefix https if no protocol
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

            const payload = JSON.stringify({ name: name || getDomain(url), url: url });
            window.chrome.webview.postMessage(__T+'shortcut-add:' + payload);
            closeDialog();
        }

        function removeShortcut(index) {
            window.chrome.webview.postMessage(__T+'shortcut-remove:' + index);
        }

        // Dialog keyboard handling
        document.getElementById('dialogOverlay').addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDialog();
            if (e.key === 'Enter') saveShortcut();
        });

        // Close dialog on overlay click
        document.getElementById('dialogOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeDialog();
        });

        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('dialogOverlay');
            if (overlay.classList.contains('open')) return;
            const input = document.querySelector('.search-input');
            if (document.activeElement !== input && !e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1) {
                input.focus();
            }
        });

        renderShortcuts();
    </script>
</body>
</html>
