<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
    <meta charset="UTF-8">
    <title>Downloads - Stride</title>
    <style>
        :root { --accent: {{ACCENT}}; --accent-rgb: {{ACCENT_RGB}}; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .toolbar {
            padding: 8px 12px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .toolbar .label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .toolbar .count {
            color: var(--accent);
            font-weight: 600;
            min-width: 20px;
            text-align: right;
        }
        .toolbar .spacer { flex: 1; }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 4px 40px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            text-align: center;
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 8px;
            opacity: 0.3;
        }
        .empty-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin: 4px 0;
            transition: background 0.15s;
        }
        .item:hover { background: var(--bg-hover); }
        .item .icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(var(--accent-rgb), 0.15);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 600;
        }
        .info { flex: 1; min-width: 0; }
        .name { font-size: 13px; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .dot.completed { background: #10B981; }
        .dot.in-progress { background: var(--accent); box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5); }
        .dot.paused { background: #F59E0B; }
        .dot.failed { background: #EF4444; }
        .dot.cancelled { background: #71717A; }
        .progress { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin: 6px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .btn { padding: 4px 8px; font-size: 11px; border: 1px solid var(--border); background: var(--bg-surface); border-radius: 4px; cursor: pointer; color: var(--text-main); transition: all 0.1s; }
        .btn:hover { background: var(--bg-hover); }
    </style>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-base: #121212;
            --bg-dark: #0C0C0C;
            --bg-surface: #1A1A1A;
            --bg-hover: #242424;
            --border: #333333;
            --text-main: #E0E0E0;
            --text-bright: #D4D4D4;
            --text-muted: #A3A3A3;
            --text-dim: #808080;
            --white: #FFFFFF;
        }
        :root[data-theme="light"] {
            --bg-base: #F5F5F3;
            --bg-dark: #EFEFEE;
            --bg-surface: #FFFFFF;
            --bg-hover: #E6E6E5;
            --border: #D4D4D2;
            --text-main: #111113;
            --text-bright: #000000;
            --text-muted: #666461;
            --text-dim: #A5A3A0;
            --white: #000000;
        }
        @media (prefers-color-scheme: light) {
            :root[data-theme="system"] {
                --bg-base: #F5F5F3;
                --bg-dark: #EFEFEE;
                --bg-surface: #FFFFFF;
                --bg-hover: #E6E6E5;
                --border: #D4D4D2;
                --text-main: #111113;
                --text-bright: #000000;
                --text-muted: #666461;
                --text-dim: #A5A3A0;
                --white: #000000;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="label">Downloads</span>
        <span class="count" id="downloadCount">0</span>
        <span class="spacer"></span>
        <button class="btn" id="clearBtn" title="Clear completed downloads">Clear completed</button>
        <button class="btn" id="clearAllBtn" title="Cancel and remove all downloads">Clear all</button>
    </div>

    <div class="main">
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📂</div>
            <div class="empty-text">No downloads yet</div>
        </div>
        <div id="downloadList"></div>
    </div>

    <script type="application/json" id="downloadsData">{{DOWNLOADS}}</script>
    <script>
        const __T = '{{IPC_TOKEN}}:';
        const dataEl = document.getElementById('downloadsData');
        let downloads = [];
        try { downloads = JSON.parse(dataEl.textContent || '[]'); } catch (err) { }

        const list = document.getElementById('downloadList');
        const emptyState = document.getElementById('emptyState');
        const countNode = document.getElementById('downloadCount');
        const itemMap = new Map();

        const STATES = {
            0: { label: 'Downloading...', cls: 'in-progress', active: true },
            1: { label: 'Paused', cls: 'paused', active: true },
            2: { label: 'Completed', cls: 'completed', active: false },
            3: { label: 'Cancelled', cls: 'cancelled', active: false },
            4: { label: 'Failed', cls: 'failed', active: false }
        };

        function stateInfo(state) {
            return STATES[state] || { label: String(state), cls: '', active: false };
        }

        function fmtBytes(bytes) {
            if (bytes <= 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
        }

        function fmtTime(iso) {
            const d = new Date(iso);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            const t = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return isToday ? t : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + t;
        }

        function getExt(name) {
            const d = name.lastIndexOf('.');
            return d > 0 ? name.substring(d + 1).toUpperCase().slice(0, 4) : '?';
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function sizeText(dl) {
            if (dl.totalBytes > 0) return fmtBytes(dl.receivedBytes) + ' / ' + fmtBytes(dl.totalBytes);
            return dl.receivedBytes > 0 ? fmtBytes(dl.receivedBytes) : '';
        }

        function speedEtaText(dl) {
            if (!dl.speedText) return '';
            return dl.speedText + (dl.etaText ? ' · ' + dl.etaText : '');
        }

        function buildItem(dl) {
            const el = document.createElement('div');
            el.className = 'item';
            el.dataset.id = dl.id;
            el.innerHTML = `
                <div class="icon"></div>
                <div class="info">
                    <div class="name"></div>
                    <div class="progress"><div class="progress-fill"></div></div>
                    <div class="meta">
                        <span class="dot"></span>
                        <span class="state-label"></span>
                        <span class="size"></span>
                        <span class="speed"></span>
                        <span class="time"></span>
                    </div>
                </div>
                <div class="actions"></div>`;
            return updateItem(el, dl);
        }

        function updateItem(el, dl) {
            const st = stateInfo(dl.state);
            el.querySelector('.icon').textContent = getExt(dl.fileName);
            el.querySelector('.name').textContent = dl.fileName;
            el.querySelector('.name').title = dl.fileName;
            el.querySelector('.dot').className = 'dot ' + st.cls;
            el.querySelector('.state-label').textContent = st.label;
            el.querySelector('.size').textContent = sizeText(dl);
            el.querySelector('.speed').textContent = speedEtaText(dl);
            el.querySelector('.time').textContent = fmtTime(dl.startedAt);

            const pct = dl.totalBytes > 0 ? Math.min(100, Math.round(dl.receivedBytes * 100 / dl.totalBytes)) : 0;
            el.querySelector('.progress-fill').style.width = pct + '%';

            const actions = el.querySelector('.actions');
            actions.innerHTML = '';
            const addBtn = (label, title, fn) => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.textContent = label;
                b.title = title;
                b.addEventListener('click', () => fn(dl.id));
                actions.appendChild(b);
            };
            if (dl.state === 2) {
                addBtn('Open', 'Open file', openFile);
                addBtn('Folder', 'Show in folder', openFolder);
            } else if (dl.state === 0) {
                addBtn('Pause', 'Pause', pause);
                addBtn('Cancel', 'Cancel', cancel);
            } else if (dl.state === 1) {
                addBtn('Resume', 'Resume', resume);
                addBtn('Cancel', 'Cancel', cancel);
            }
            return el;
        }

        function sync(newDownloads) {
            const seen = new Set();
            for (const dl of newDownloads) {
                seen.add(dl.id);
                const existing = itemMap.get(dl.id);
                if (existing) updateItem(existing, dl);
                else { const el = buildItem(dl); itemMap.set(dl.id, el); list.appendChild(el); }
            }
            for (const [id, el] of itemMap) {
                if (!seen.has(id)) { el.remove(); itemMap.delete(id); }
            }
            emptyState.style.display = newDownloads.length ? 'none' : 'flex';
            countNode.textContent = newDownloads.length;
        }

        function post(msg) {
            if (window.chrome?.webview) window.chrome.webview.postMessage(msg);
        }

        function pause(id) { post(__T + 'download-pause:' + id); }
        function resume(id) { post(__T + 'download-resume:' + id); }
        function cancel(id) { post(__T + 'download-cancel:' + id); }
        function openFile(id) { post(__T + 'download-open:' + id); }
        function openFolder(id) { post(__T + 'download-folder:' + id); }

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm('Clear completed downloads?')) post(__T + 'download-clear');
        });
        document.getElementById('clearAllBtn').addEventListener('click', () => {
            if (confirm('Cancel and remove all downloads?')) post(__T + 'download-clear-all');
        });

        if (window.chrome?.webview) {
            window.chrome.webview.addEventListener('message', (e) => {
                const msg = String(e.data || '');
                const prefix = __T + 'downloads:';
                if (msg.startsWith(prefix)) {
                    try { downloads = JSON.parse(msg.slice(prefix.length)); sync(downloads); } catch (err) { }
                }
            });
        }

        setInterval(() => post(__T + 'download-sync'), 500);

        sync(downloads);
    </script>
</body>
</html>
