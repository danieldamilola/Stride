<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
    <meta charset="UTF-8">
    <title>Downloads - Stride</title>
    <style>
        :root { --accent: {{ACCENT}}; --accent-rgb: {{ACCENT_RGB}}; }

        :root, :root[data-theme="dark"] {
            --bg-base: #0e0d0b;
            --bg-surface: #141310;
            --bg-hover: #1f1d19;
            --border: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.04);
            --text-bright: #f4f4f5;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
            --text-dim: #71717a;
        }
        :root[data-theme="light"] {
            --bg-base: #f8f8fa;
            --bg-surface: #ffffff;
            --bg-hover: #f4f4f6;
            --border: rgba(0, 0, 0, 0.08);
            --border-subtle: rgba(0, 0, 0, 0.04);
            --text-bright: #09090b;
            --text-main: #18181b;
            --text-muted: #71717a;
            --text-dim: #a1a1aa;
        }
        @media (prefers-color-scheme: light) {
            :root[data-theme="system"] {
                --bg-base: #f8f8fa;
                --bg-surface: #ffffff;
                --bg-hover: #f4f4f6;
                --border: rgba(0, 0, 0, 0.08);
                --border-subtle: rgba(0, 0, 0, 0.04);
                --text-main: #18181b;
                --text-bright: #09090b;
                --text-muted: #71717a;
                --text-dim: #a1a1aa;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: 24px 32px;
        }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-bright);
            flex-shrink: 0;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .icon-btn {
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            transition: background 150ms, color 150ms, border-color 150ms;
        }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text-main); }
        .icon-btn.danger:hover { background: rgba(229, 80, 80, 0.08); border-color: rgba(229, 80, 80, 0.3); color: #E55050; }

        /* ── Main Content ── */
        .main {
            flex: 1;
            overflow-y: auto;
        }
        .list-inner {
            max-width: 680px;
            margin: 0 auto;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            text-align: center;
            margin-top: 80px;
        }
        .empty-icon { font-size: 40px; margin-bottom: 8px; opacity: 0.25; }
        .empty-text { color: var(--text-dim); font-size: 13px; }

        .item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            background: var(--bg-surface);
            border-radius: 12px;
            margin: 8px 0;
            transition: background 0.15s;
        }
        .item:hover { background: var(--bg-hover); }
        .item .icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
        }
        .item .icon img { width: 32px; height: 32px; }
        .info { flex: 1; min-width: 0; }
        .name { font-size: 13px; font-weight: 500; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        
        .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
        .dot.completed { background: var(--text-dim); }
        .dot.in-progress { background: var(--text-bright); box-shadow: 0 0 6px rgba(255, 255, 255, 0.4); }
        .dot.paused { background: var(--text-muted); }
        .dot.failed { background: var(--text-dim); }
        .dot.cancelled { background: var(--text-dim); }
        
        .progress { width: 100%; height: 3px; background: var(--border); border-radius: 2px; margin: 8px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--text-bright); transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        
        .btn {
            padding: 6px 14px;
            font-size: 11.5px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-main);
            transition: background 0.1s;
        }
        .btn:hover { background: var(--bg-hover); color: var(--text-bright); border-color: var(--border-subtle); }

        /* ── Confirm dialog ── */
        .dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .dialog-overlay.open { display: flex; }
        .dialog {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            width: 320px;
        }
        .dialog h3 { font-size: 14px; font-weight: 600; color: var(--text-bright); margin-bottom: 8px; }
        .dialog p { font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .dialog-actions button {
            padding: 7px 16px; border-radius: 7px; border: 1px solid var(--border);
            background: transparent; color: var(--text-muted); font-size: 12.5px;
            transition: background 150ms, color 150ms;
        }
        .dialog-actions button:hover { background: var(--bg-hover); color: var(--text-bright); }
        .dialog-actions button.danger { background: rgba(229, 80, 80, 0.08); border-color: rgba(229, 80, 80, 0.3); color: #E55050; }
        .dialog-actions button.danger:hover { background: rgba(229, 80, 80, 0.16); }
    </style>

</head>
<body>
    <div class="header">
        <h1>Downloads</h1>
        <div class="header-actions">
            <button class="icon-btn" id="clearBtn">Clear completed</button>
            <button class="icon-btn danger" id="clearAllBtn">Clear all</button>
        </div>
    </div>

    <div class="main">
        <div class="list-inner">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">📂</div>
                <div class="empty-text">No downloads yet</div>
            </div>
            <div id="downloadList"></div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div class="dialog-overlay" id="confirmDialog">
        <div class="dialog">
            <h3 id="confirmTitle">Confirm</h3>
            <p id="confirmMessage">Are you sure?</p>
            <div class="dialog-actions">
                <button onclick="closeConfirm()">Cancel</button>
                <button class="danger" id="confirmActionBtn">Confirm</button>
            </div>
        </div>
    </div>

    <script type="application/json" id="downloadsData">{{DOWNLOADS}}</script>
    <script>
        const __T = '{{IPC_TOKEN}}:';
        const dataEl = document.getElementById('downloadsData');
        let downloads = [];
        try { downloads = JSON.parse(dataEl.textContent || '[]'); } catch (err) { }

        const list = document.getElementById('downloadList');
        const emptyState = document.getElementById('emptyState');
        const countNode = document.getElementById('downloadCount');
        const itemMap = new Map();

        const STATES = {
            0: { label: 'Downloading...', cls: 'in-progress', active: true },
            1: { label: 'Paused', cls: 'paused', active: true },
            2: { label: 'Completed', cls: 'completed', active: false },
            3: { label: 'Cancelled', cls: 'cancelled', active: false },
            4: { label: 'Failed', cls: 'failed', active: false }
        };

        function stateInfo(state) {
            return STATES[state] || { label: String(state), cls: '', active: false };
        }

        function fmtBytes(bytes) {
            if (bytes <= 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
        }

        function fmtTime(iso) {
            const d = new Date(iso);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            const t = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return isToday ? t : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + t;
        }

        function getExt(name) {
            const d = name.lastIndexOf('.');
            return d > 0 ? name.substring(d + 1).toUpperCase().slice(0, 4) : '?';
        }

        // Custom modal confirm
        let currentConfirmAction = null;
        function showConfirm(title, message, actionText, actionFn) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            const btn = document.getElementById('confirmActionBtn');
            btn.textContent = actionText;
            currentConfirmAction = actionFn;
            document.getElementById('confirmDialog').classList.add('open');
        }

        function closeConfirm() {
            document.getElementById('confirmDialog').classList.remove('open');
            currentConfirmAction = null;
        }

        document.getElementById('confirmActionBtn').addEventListener('click', () => {
            if (currentConfirmAction) currentConfirmAction();
            closeConfirm();
        });

        document.getElementById('confirmDialog').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeConfirm();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeConfirm();
        });


        function sizeText(dl) {
            if (dl.totalBytes > 0) return fmtBytes(dl.receivedBytes) + ' / ' + fmtBytes(dl.totalBytes);
            return dl.receivedBytes > 0 ? fmtBytes(dl.receivedBytes) : '';
        }

        function speedEtaText(dl) {
            if (!dl.speedText) return '';
            return dl.speedText + (dl.etaText ? ' · ' + dl.etaText : '');
        }

        function buildItem(dl) {
            const el = document.createElement('div');
            el.className = 'item';
            el.dataset.id = dl.id;
            el.innerHTML = `
                <div class="icon"></div>
                <div class="info">
                    <div class="name"></div>
                    <div class="progress"><div class="progress-fill"></div></div>
                    <div class="meta">
                        <span class="dot"></span>
                        <span class="state-label"></span>
                        <span class="size"></span>
                        <span class="speed"></span>
                    </div>
                </div>
                <div class="actions"></div>`;
            return updateItem(el, dl);
        }

        function updateItem(el, dl) {
            const st = stateInfo(dl.state);
            const ext = getExt(dl.fileName);
            const iconEl = el.querySelector('.icon');
            if (iconEl.dataset.ext !== ext) {
                iconEl.dataset.ext = ext;
                iconEl.innerHTML = `<img src="https://img.icons8.com/color/48/${ext.toLowerCase()}.png" onerror="this.onerror=null; this.parentNode.textContent='${ext}'">`;
            }
            el.querySelector('.name').textContent = dl.fileName;
            el.querySelector('.name').title = dl.fileName;
            
            if (dl.state === 2) { // 2 = Completed
                el.querySelector('.meta').style.display = 'none';
                el.querySelector('.progress').style.display = 'none';
            } else {
                el.querySelector('.meta').style.display = 'flex';
                el.querySelector('.progress').style.display = 'block';
                el.querySelector('.dot').className = 'dot ' + st.cls;
                el.querySelector('.state-label').textContent = st.label;
                el.querySelector('.size').textContent = sizeText(dl);
                el.querySelector('.speed').textContent = speedEtaText(dl);
                const pct = dl.totalBytes > 0 ? Math.min(100, Math.round(dl.receivedBytes * 100 / dl.totalBytes)) : 0;
                el.querySelector('.progress-fill').style.width = pct + '%';
            }

            const actions = el.querySelector('.actions');
            actions.innerHTML = '';
            const addBtn = (label, title, fn) => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.textContent = label;
                b.title = title;
                b.addEventListener('click', () => fn(dl.id));
                actions.appendChild(b);
            };
            if (dl.state === 2) {
                addBtn('Open', 'Open file', openFile);
                addBtn('Folder', 'Show in folder', openFolder);
            } else if (dl.state === 0) {
                addBtn('Pause', 'Pause', pause);
                addBtn('Cancel', 'Cancel', cancel);
            } else if (dl.state === 1) {
                addBtn('Resume', 'Resume', resume);
                addBtn('Cancel', 'Cancel', cancel);
            }
            return el;
        }

        function sync(newDownloads) {
            const seen = new Set();
            for (const dl of newDownloads) {
                seen.add(dl.id);
                const existing = itemMap.get(dl.id);
                if (existing) updateItem(existing, dl);
                else { const el = buildItem(dl); itemMap.set(dl.id, el); list.appendChild(el); }
            }
            for (const [id, el] of itemMap) {
                if (!seen.has(id)) { el.remove(); itemMap.delete(id); }
            }
            emptyState.style.display = newDownloads.length ? 'none' : 'flex';
            if (countNode) countNode.textContent = newDownloads.length;
        }

        function post(msg) {
            if (window.chrome?.webview) window.chrome.webview.postMessage(msg);
        }

        function pause(id) { post(__T + 'download-pause:' + id); }
        function resume(id) { post(__T + 'download-resume:' + id); }
        function cancel(id) { post(__T + 'download-cancel:' + id); }
        function openFile(id) { post(__T + 'download-open:' + id); }
        function openFolder(id) { post(__T + 'download-folder:' + id); }

        document.getElementById('clearBtn').addEventListener('click', () => {
            showConfirm(
                'Clear completed?',
                'This will remove all completed downloads from the list. The files will remain on your computer.',
                'Clear completed',
                () => post(__T + 'download-clear')
            );
        });

        document.getElementById('clearAllBtn').addEventListener('click', () => {
             showConfirm(
                'Clear all downloads?',
                'This will cancel active downloads and remove everything from the list. The files will remain on your computer.',
                'Clear all',
                () => post(__T + 'download-clear-all')
            );
        });

        if (window.chrome?.webview) {
            window.chrome.webview.addEventListener('message', (e) => {
                const msg = String(e.data || '');
                const prefix = __T + 'downloads:';
                if (msg.startsWith(prefix)) {
                    try { downloads = JSON.parse(msg.slice(prefix.length)); sync(downloads); } catch (err) { }
                }
            });
        }

        setInterval(() => post(__T + 'download-sync'), 500);

        sync(downloads);
    </script>
</body>
</html>
