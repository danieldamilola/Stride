<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download history - Umber</title>
<style>
:root { color-scheme: dark; --bg-base:#181818; --bg-surface:#242424; --bg-hover:#2c2c2c; --border:#383838; --text-main:#ededed; --text-muted:#a6a6a6; --text-link:#e2e2e2; --download-progress:#c9c9c9; --danger-text:#e5a6a1; }
:root[data-theme="light"] { color-scheme:light; --bg-base:#f9f9f9; --bg-dark:#f9f9f9; --bg-surface:#ffffff; --bg-hover:#e8e8e8; --bg-card:#ffffff; --card:#ffffff; --border:#d9d9d9; --border-subtle:#e8e8e8; --control-border:#8d8d8d; --text-main:#202020; --text-bright:#202020; --text-muted:#5f5f5f; --text-dim:#5f5f5f; --white:#202020; --solid:#202020; --on-solid:#ffffff; --text-link:#3a3a3a; --download-progress:#646464; --danger-text:#b42318; }
@media(prefers-color-scheme:light) { :root[data-theme="system"] { color-scheme:light; --bg-base:#f9f9f9; --bg-dark:#f9f9f9; --bg-surface:#ffffff; --bg-hover:#e8e8e8; --bg-card:#ffffff; --card:#ffffff; --border:#d9d9d9; --border-subtle:#e8e8e8; --control-border:#8d8d8d; --text-main:#202020; --text-bright:#202020; --text-muted:#5f5f5f; --text-dim:#5f5f5f; --white:#202020; --solid:#202020; --on-solid:#ffffff; --text-link:#3a3a3a; --download-progress:#646464; --danger-text:#b42318; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg-base); color:var(--text-main); font:13px "Segoe UI",sans-serif; }
button,input { font:inherit; color:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible { outline:2px solid var(--focus-ring); outline-offset:3px; }
[hidden] { display:none !important; }
.header { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:24px; padding:20px 28px; background:var(--bg-base); }
h1 { margin:0; font-size:20px; font-weight:600; white-space:nowrap; }
.search { position:relative; max-width:560px; flex:1; margin:0 auto; }
.search svg { position:absolute; width:16px; height:16px; top:11px; left:12px; color:var(--text-muted); }
.search input { width:100%; min-width:0; padding:10px 12px 10px 36px; border:1px solid transparent; border-radius:7px; background:var(--bg-surface); }
.search input::placeholder { color:var(--text-muted); }
.header-actions { display:flex; gap:4px; }
.icon-btn { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:30px; height:30px; padding:7px; border:0; border-radius:5px; background:transparent; color:var(--text-muted); }
.icon-btn:hover { background:var(--bg-hover); color:var(--text-main); }
.icon-btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
.main { max-width:752px; padding:12px 28px 48px; margin:auto; }
.day-group { margin:0 0 30px; }
.day-title { font-size:13px; font-weight:500; margin:12px 0 14px; }
.item { display:grid; grid-template-columns:36px minmax(0,1fr) auto; align-items:start; column-gap:16px; background:var(--bg-surface); border-radius:9px; padding:18px 20px; margin:0 0 10px; }
.file-icon { width:32px; height:32px; display:grid; place-items:center; margin-top:1px; }
.file-icon img,.file-icon svg { width:32px; height:32px; object-fit:contain; }
.file-icon svg { fill:none; stroke:var(--text-muted); stroke-width:1.2; stroke-linejoin:round; }
.info { min-width:0; }
.name { display:block; padding:0; max-width:100%; border:0; background:none; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; font-size:13px; line-height:20px; color:var(--text-main); }
.name:enabled { color:var(--text-link); text-decoration:underline; text-underline-offset:3px; }
.name:disabled { cursor:default; opacity:1; }
.item.missing .name { text-decoration:line-through; color:var(--text-muted); }
.meta { display:flex; align-items:center; flex-wrap:wrap; gap:5px 12px; color:var(--text-muted); font-size:11px; line-height:17px; margin-top:3px; }
.source { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:4px; color:var(--text-muted); font-size:11px; }
.progress { margin-top:12px; height:3px; background:var(--border); overflow:hidden; border-radius:2px; }
.progress-fill { height:100%; background:var(--download-progress); transition:width .2s; }
.progress.indeterminate .progress-fill { width:30% !important; animation:downloading 1.2s ease-in-out infinite alternate; }
@keyframes downloading { from { transform:translateX(-100%); } to { transform:translateX(300%); } }
@media(prefers-reduced-motion:reduce) { .progress-fill { transition:none; } .progress.indeterminate .progress-fill { animation:none; } }
.actions { display:flex; align-items:center; gap:2px; margin:-4px -6px 0 8px; }
.error { margin-top:7px; color:var(--danger-text); font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
.empty-state { text-align:center; padding:80px 16px; color:var(--text-muted); }
.empty-state svg { width:36px; height:36px; margin-bottom:12px; fill:none; stroke:currentColor; stroke-width:1.2; }
.empty-state p { margin:0; }
dialog { width:min(360px,calc(100vw - 32px)); padding:24px; border:1px solid var(--border); border-radius:12px; background:var(--bg-surface); color:var(--text-main); }
dialog::backdrop { background:rgb(0 0 0 / 55%); }
dialog h2 { font-size:16px; margin:0 0 10px; }
dialog p { color:var(--text-muted); line-height:1.6; margin:0 0 20px; }
.dialog-actions { display:flex; justify-content:flex-end; gap:8px; }
.dialog-actions button { padding:7px 12px; border:1px solid var(--border); border-radius:6px; background:transparent; }
.dialog-actions button:hover { background:var(--bg-hover); }
@media(max-width:650px) { .header { flex-wrap:wrap; gap:12px; padding:16px; } .header h1 { font-size:18px; flex:1; } .search { order:3; flex-basis:100%; max-width:none; } .main { padding:4px 16px 32px; } .item { padding:14px 12px; column-gap:10px; grid-template-columns:28px minmax(0,1fr) auto; } .file-icon,.file-icon img,.file-icon svg { width:26px; height:26px; } .actions { gap:0; margin-left:2px; } .icon-btn { width:28px; height:28px; padding:6px; } }
</style>
</head>
<body>
<header class="header page-toolbar">
    <h1 class="page-title">Download history</h1>

    <div class="header-actions page-actions">
        <label class="search page-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Search download history" aria-label="Search download history" autocomplete="off"></label>
        <button class="icon-btn" id="clearBtn" title="Clear finished history" aria-label="Clear finished history"></button>
        <button class="icon-btn" id="clearAllBtn" title="Cancel downloads and clear history" aria-label="Cancel downloads and clear history"></button>
    </div>
</header>
<main class="main">
    <div class="empty-state" id="emptyState" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><p id="emptyText">No downloads yet</p></div>
    <div id="downloadList"></div>
    <nav aria-label="Download history pages" style="display:flex;align-items:center;gap:16px"><button id="previousPage" type="button">Previous</button><span id="pageStatus" role="status" aria-live="polite"></span><button id="nextPage" type="button">Next</button></nav>
</main>
<dialog id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <h2 id="confirmTitle"></h2><p id="confirmMessage"></p>
    <div class="dialog-actions"><button id="confirmCancelBtn" autofocus>Cancel</button><button id="confirmActionBtn">Clear history</button></div>
</dialog>
<script type="application/json" id="downloadsData">{{DOWNLOADS}}</script>
<script>
const __T = '{{IPC_TOKEN}}:';
let downloads = [];
const rowData = new Map();
let page = 0, total = 0, sequence = 0, active = true, timer;
const client = globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2);
let request = client + ':0';
const list = document.getElementById('downloadList');
const itemMap = new Map(), groupMap = new Map();
const paths = {
    pause:'M8 5v14M16 5v14', resume:'m8 5 11 7-11 7Z',
    cancel:'M12 2a10 10 0 1 0 .01 0M8 8l8 8m0-8-8 8',
    folder:'M2 19V5h7l3 3h10v11ZM2 10h20',
    retry:'M20 8a9 9 0 1 0 0 8M20 2v6h-6',
    remove:'m6 6 12 12M18 6 6 18',
    link:'m10 13 4-4M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m2 2 2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0',
    clear:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7',
    clearAll:'M4 4l16 16M9 4h6M3 7h3m3 0h12M6 10l1 11h10l1-5M18 7l-.3 4'
};
function svg(key) { return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + paths[key] + '"/></svg>'; }
document.getElementById('clearBtn').innerHTML = svg('clear');
document.getElementById('clearAllBtn').innerHTML = svg('clearAll');
function fmtBytes(bytes) {
    if (!(bytes > 0)) return '0 B';
    const units = ['B','KB','MB','GB','TB'], i = Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),4);
    return (bytes/Math.pow(1024,i)).toFixed(i ? 1 : 0) + ' ' + units[i];
}
function dateInfo(iso, now = new Date()) {
    const date = new Date(iso);
    if (!Number.isFinite(date.getTime())) return { key:'unknown', label:'Unknown date' };
    const key = [date.getFullYear(),date.getMonth(),date.getDate()].join('-');
    const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
    const label = date.toDateString() === now.toDateString() ? 'Today' : date.toDateString() === yesterday.toDateString() ? 'Yesterday' : date.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
    return {key,label};
}
function post(message) { window.chrome?.webview?.postMessage(message); }
function scheduleSync() {
    clearTimeout(timer);
    if (!document.hidden) timer = setTimeout(requestSync, active ? 500 : 5000);
}
function requestSync() {
    if (document.hidden) return;
    post(__T + 'download-sync:' + JSON.stringify({ query:document.getElementById('search').value, page, request }));
    scheduleSync();
}
function changePage(next = 0) {
    page = next; request = client + ':' + ++sequence; active = true;
    requestSync();
}
function send(prefix,id) { post(__T + prefix + id); requestSync(); }
function actionsFor(dl) {
    const actions = [];
    if (dl.canPause) actions.push(['pause','Pause download','download-pause:']);
    if (dl.canResume) actions.push(['resume','Resume download','download-resume:']);
    if (dl.canRestart) actions.push(['retry',dl.retryLabel || 'Retry download','download-retry:']);
    if (dl.url && /^https?:\/\//i.test(dl.url)) actions.push(['link','Copy download link','download-copy:']);
    if (dl.canOpen) actions.push(['folder','Show in folder','download-folder:']);
    if (dl.canCancel) actions.push(['cancel','Cancel download','download-cancel:']);
    else actions.push(['remove','Remove from history','download-remove:']);
    return actions;
}
function buildItem(dl) {
    const el = document.createElement('article'); el.className = 'item'; el.dataset.id = dl.id;
    el.innerHTML = '<div class="file-icon"><img alt="" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8m-8 4h8"/></svg></div><div class="info"><button class="name" type="button"></button><div class="source"></div><div class="meta"><span class="size"></span><time class="timestamp"></time></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill"></div></div><div class="error" role="status"></div></div><div class="actions"></div>';
    el.querySelector('.name').addEventListener('click',()=>send('download-open:',dl.id));
    return el;
}
function updateItem(el,dl) {
    const text = (selector,value) => { const node = el.querySelector(selector); if (node.textContent !== value) node.textContent = value; };
    text('.name',dl.fileName || 'Download');
    const name = el.querySelector('.name'); name.title = dl.fileName || ''; name.disabled = !dl.canOpen;
    name.setAttribute('aria-label',dl.canOpen ? 'Open ' + dl.fileName : dl.fileName || 'Download');
    el.classList.toggle('missing',!!dl.isMissing);
    const img = el.querySelector('img'), fallback = el.querySelector('.file-icon svg');
    const hasIcon = typeof dl.fileIcon === 'string' && dl.fileIcon.startsWith('data:image/png;base64,');
    if (hasIcon && img.getAttribute('src') !== dl.fileIcon) img.src = dl.fileIcon;
    img.hidden = !hasIcon; fallback.toggleAttribute('hidden',hasIcon);
    const completed = dl.state === 2, active = dl.state === 0 || dl.state === 1 || dl.isStarting;
    const total = dl.totalBytes > 0 ? dl.totalBytes : dl.receivedBytes;
    let summary;
    if (dl.isMissing) summary = 'File deleted';
    else if (completed) summary = fmtBytes(total);
    else if (dl.isStarting) summary = 'Starting download...';
    else if (dl.state === 0) summary = [dl.speedText, dl.sizeText || fmtBytes(dl.receivedBytes), dl.etaText].filter(Boolean).join(' \u00b7 ');
    else summary = [dl.state === 1 ? (dl.canResume ? 'Paused' : 'Interrupted') : dl.state === 3 ? 'Cancelled' : 'Failed', dl.sizeText].filter(Boolean).join(' \u00b7 ');
    text('.size',summary);
    const time = new Date(dl.completedAt || dl.startedAt), stamp = el.querySelector('.timestamp');
    const validTime = Number.isFinite(time.getTime());
    text('.timestamp',validTime ? time.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}) : '');
    if (validTime) { stamp.dateTime = time.toISOString(); stamp.title = time.toLocaleString(); }
    const source = el.querySelector('.source'); text('.source',dl.sourceHost ? 'From ' + dl.sourceHost : ''); source.title = dl.url || ''; source.hidden = !active || !dl.sourceHost;
    text('.error',dl.errorMessage || ''); el.querySelector('.error').hidden = !dl.errorMessage;
    const progress = el.querySelector('.progress'); progress.hidden = !active;
    progress.classList.toggle('indeterminate',!!dl.isIndeterminate);
    progress.setAttribute('aria-label',(dl.fileName || 'Download') + ': ' + (dl.statusText || summary));
    const percent = dl.totalBytes > 0 ? Math.max(0,Math.min(100,dl.receivedBytes*100/dl.totalBytes)) : 0;
    if (dl.isIndeterminate) progress.removeAttribute('aria-valuenow'); else progress.setAttribute('aria-valuenow',String(Math.round(percent)));
    el.querySelector('.progress-fill').style.width = percent + '%';
    const available = actionsFor(dl), actions = el.querySelector('.actions');
    const signature = available.map(action=>action[0]+action[1]).join('|');
    // Progress updates keep existing controls and keyboard focus.
    if (actions.dataset.signature !== signature) {
        actions.dataset.signature = signature;
        actions.replaceChildren(...available.map(([icon,label,route])=>{
            const button = document.createElement('button'); button.type = 'button'; button.className = 'icon-btn';
            button.title = label; button.setAttribute('aria-label',label); button.innerHTML = svg(icon);
            button.addEventListener('click',()=>send(route,dl.id)); return button;
        }));
    }
}
function sync(incoming) {
    // Ignore replies for a search or page that the user has already left.
    if (incoming.request !== request || !Array.isArray(incoming.ids) || !Array.isArray(incoming.changed)) return;
    page = incoming.page; total = incoming.total; active = incoming.active;
    const ids = new Set(incoming.ids);
    for (const [id,el] of itemMap) if (!ids.has(id)) { el.remove(); itemMap.delete(id); rowData.delete(id); }
    for (const dl of incoming.changed) {
        rowData.set(dl.id,dl);
        let el = itemMap.get(dl.id);
        if (!el) { el = buildItem(dl); itemMap.set(dl.id,el); }
        updateItem(el,dl);
    }
    downloads = incoming.ids.map(id=>rowData.get(id)).filter(Boolean);
    const groups = new Map();
    for (const dl of downloads) {
        const info = dateInfo(dl.startedAt);
        if (!groups.has(info.key)) groups.set(info.key,{label:info.label,items:[]});
        groups.get(info.key).items.push(dl);
    }
    let groupIndex = 0;
    for (const [key,group] of groups) {
        let section = groupMap.get(key);
        if (!section) { section = document.createElement('section'); section.className = 'day-group'; section.innerHTML = '<h2 class="day-title"></h2><div class="day-items"></div>'; groupMap.set(key,section); }
        const heading = section.querySelector('h2'); if (heading.textContent !== group.label) heading.textContent = group.label;
        if (list.children[groupIndex] !== section) list.insertBefore(section,list.children[groupIndex] || null);
        groupIndex++;
        const target = section.querySelector('.day-items'); let index = 0;
        for (const dl of group.items) {
            const el = itemMap.get(dl.id);
            if (target.children[index] !== el) target.insertBefore(el,target.children[index] || null);
            index++;
        }
    }
    for (const [key,section] of groupMap) if (!groups.has(key)) { section.remove(); groupMap.delete(key); }
    document.getElementById('emptyState').hidden = downloads.length !== 0;
    document.getElementById('emptyText').textContent = document.getElementById('search').value.trim() ? 'No matching downloads' : 'No downloads yet';
    document.getElementById('previousPage').disabled = page === 0;
    document.getElementById('nextPage').disabled = (page + 1) * 50 >= total;
    document.getElementById('pageStatus').textContent = total ? (page * 50 + 1) + ' to ' + Math.min((page + 1) * 50,total) + ' of ' + total : '0 downloads';
    scheduleSync();
}
let confirmAction = null;
const dialog = document.getElementById('confirmDialog');
function showConfirm(title,message,action) {
    document.getElementById('confirmTitle').textContent = title; document.getElementById('confirmMessage').textContent = message;
    confirmAction = action; dialog.showModal();
}
document.getElementById('confirmCancelBtn').addEventListener('click',()=>dialog.close());
dialog.addEventListener('close',()=>{ confirmAction = null; });
document.getElementById('confirmActionBtn').addEventListener('click',()=>{ confirmAction?.(); dialog.close(); requestSync(); });
document.getElementById('clearBtn').addEventListener('click',()=>showConfirm('Clear finished history?','This removes finished and cancelled records. Files stay on your computer.',()=>post(__T + 'download-clear')));
document.getElementById('clearAllBtn').addEventListener('click',()=>showConfirm('Cancel downloads and clear history?','Active downloads will be cancelled. Downloaded files stay on your computer.',()=>post(__T + 'download-clear-all')));
document.getElementById('search').maxLength = 2048;
document.getElementById('search').addEventListener('input',()=>changePage());
document.getElementById('previousPage').addEventListener('click',()=>changePage(Math.max(0,page-1)));
document.getElementById('nextPage').addEventListener('click',()=>changePage(page+1));
window.chrome?.webview?.addEventListener('message',event=>{
    const message = String(event.data || ''), prefix = __T + 'downloads:';
    if (message.startsWith(prefix)) { try { sync(JSON.parse(message.slice(prefix.length))); } catch {} }
});
window.addEventListener('focus',requestSync);
document.addEventListener('visibilitychange',()=>{ clearTimeout(timer); if (!document.hidden) requestSync(); });
requestSync();
</script>
</body>
</html>
