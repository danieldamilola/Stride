<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
    <meta charset="UTF-8">
    <title>OneTab - Stride</title>
    <style>
        :root { --accent: {{ACCENT}}; --accent-rgb: {{ACCENT_RGB}}; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-dark);
            color: var(--text-bright);
            font-family: 'Segoe UI', Inter, sans-serif;
            padding: 24px 32px;
        }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 20px; }
        .group {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-surface);
        }
        .group-name {
            font-weight: 600;
            font-size: 14px;
            cursor: text;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .group-name:focus { outline: 1px solid var(--accent); background: var(--bg-hover)222; }
        .group-time { color: var(--text-muted)444; font-size: 11px; }
        .group-count { color: #7A7A7A; font-size: 12px; margin-left: auto; }
        .btn {
            padding: 5px 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: #7A7A7A;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .btn:hover { background: var(--bg-hover)222; color: var(--text-bright); }
        .btn-danger:hover { background: #C4453A; border-color: #C4453A; color: white; }
        .tab-list { padding: 4px 0; }
        .tab {
            display: flex;
            align-items: center;
            padding: 6px 16px;
            gap: 8px;
            transition: background 0.15s;
        }
        .tab:hover { background: var(--bg-hover)222; }
        .tab-star {
            cursor: pointer;
            font-size: 14px;
            color: var(--text-muted)444;
            transition: color 0.15s;
        }
        .tab-star.starred { color: #F59E0B; }
        .tab-star:hover { color: #F59E0B; }
        .tab-title {
            color: var(--text-bright);
            text-decoration: none;
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tab-title:hover { color: var(--accent); }
        .tab-url {
            color: var(--text-muted)444;
            font-size: 11px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tab-delete {
            background: none;
            border: none;
            color: var(--text-muted)444;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 4px;
            border-radius: 3px;
            opacity: 0;
            transition: all 0.15s;
        }
        .tab:hover .tab-delete { opacity: 1; }
        .tab-delete:hover { color: #C4453A; background: #1A0000; }
        .empty {
            color: var(--text-muted)444;
            font-size: 14px;
            text-align: center;
            margin-top: 80px;
        }
        .search-bar {
            display: flex;
            margin-bottom: 16px;
        }
        .search-bar input {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text-bright);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .search-bar input:focus { border-color: var(--accent); }
        .search-bar input::placeholder { color: var(--text-muted)444; }
        .group.hidden, .tab.hidden { display: none !important; }
    </style>
<style>
:root, :root[data-theme="dark"] {
    --bg-base: var(--bg-base);
    --bg-dark: var(--bg-dark);
    --bg-surface: var(--bg-surface);
    --bg-hover: var(--bg-hover);
    --border: var(--border);
    --text-main: var(--text-main);
    --text-bright: var(--text-bright);
    --text-muted: var(--text-muted);
    --text-dim: var(--text-dim);
    --white: var(--white);
}
:root[data-theme="light"] {
    --bg-base: #F5F5F3;
    --bg-dark: #EFEFEE;
    --bg-surface: var(--white);
    --bg-hover: #E6E6E5;
    --border: #D4D4D2;
    --text-main: #111113;
    --text-bright: #000000;
    --text-muted: #666461;
    --text-dim: #A5A3A0;
    --white: #000000;
}
@media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
        --bg-base: #F5F5F3;
        --bg-dark: #EFEFEE;
        --bg-surface: var(--white);
        --bg-hover: #E6E6E5;
        --border: #D4D4D2;
        --text-main: #111113;
        --text-bright: #000000;
        --text-muted: #666461;
        --text-dim: #A5A3A0;
        --white: #000000;
    }
}
</style>
<style>
:root, :root[data-theme="dark"] {
    --bg-base: #121212;
    --bg-dark: #0C0C0C;
    --bg-surface: #1A1A1A;
    --bg-hover: #242424;
    --border: var(--border)333;
    --text-main: #E0E0E0;
    --text-bright: #D4D4D4;
    --text-muted: #A3A3A3;
    --text-dim: #808080;
    --white: #FFFFFF;
}
:root[data-theme="light"] {
    --bg-base: #F5F5F3;
    --bg-dark: #EFEFEE;
    --bg-surface: #FFFFFF;
    --bg-hover: #E6E6E5;
    --border: #D4D4D2;
    --text-main: #111113;
    --text-bright: #000000;
    --text-muted: #666461;
    --text-dim: #A5A3A0;
    --white: #000000;
}
@media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
        --bg-base: #F5F5F3;
        --bg-dark: #EFEFEE;
        --bg-surface: #FFFFFF;
        --bg-hover: #E6E6E5;
        --border: #D4D4D2;
        --text-main: #111113;
        --text-bright: #000000;
        --text-muted: #666461;
        --text-dim: #A5A3A0;
        --white: #000000;
    }
}
</style>
</head>
<body>
    <h1>OneTab</h1>
    {{SEARCH}}
    {{CONTENT}}
    <script>
    (function() {
        var input = document.getElementById('onetab-search');
        if (!input) return;
        input.addEventListener('input', function() {
            var q = input.value.toLowerCase().trim();
            var groups = document.querySelectorAll('.group');
            for (var i = 0; i < groups.length; i++) {
                var g = groups[i];
                var tabs = g.querySelectorAll('.tab');
                var anyVisible = false;
                for (var j = 0; j < tabs.length; j++) {
                    var t = tabs[j];
                    var title = (t.querySelector('.tab-title') || {}).textContent || '';
                    var url = (t.querySelector('.tab-url') || {}).textContent || '';
                    var match = !q || title.toLowerCase().includes(q) || url.toLowerCase().includes(q);
                    t.classList.toggle('hidden', !match);
                    if (match) anyVisible = true;
                }
                // Also check group name
                var name = (g.querySelector('.group-name') || {}).textContent || '';
                if (name.toLowerCase().includes(q)) anyVisible = true;
                g.classList.toggle('hidden', !anyVisible && q.length > 0);
            }
        });
    })();
    </script>
</body>
</html>
