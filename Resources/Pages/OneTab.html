<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Saved tabs - Umber</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-dark);
            color: var(--text-bright);
            font-family: 'Segoe UI', Inter, sans-serif;
            padding: 24px 32px;
        }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 20px; }
        .group {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-surface);
        }
        .group-name {
            font-weight: 600;
            font-size: 14px;
            cursor: text;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .group-name:focus { outline: 1px solid var(--focus-ring); background: var(--bg-hover); }
        .group-time { color: var(--text-muted); font-size: 11px; }
        .group-count { color: #7A7A7A; font-size: 12px; margin-left: auto; }
        .btn {
            padding: 5px 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: #7A7A7A;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .btn:hover { background: var(--bg-hover); color: var(--text-bright); }
        .btn-danger:hover { background: #C4453A; border-color: #C4453A; color: white; }
        .tab-list { padding: 4px 0; }
        .tab {
            display: flex;
            align-items: center;
            padding: 6px 16px;
            gap: 8px;
            transition: background 0.15s;
        }
        .tab:hover { background: var(--bg-hover); }
        .tab-star {
            cursor: pointer;
            font-size: 14px;
            color: var(--text-muted);
            transition: color 0.15s;
        }
        .tab-star.starred { color: #F59E0B; }
        .tab-star:hover { color: #F59E0B; }
        .tab-title {
            color: var(--text-bright);
            text-decoration: none;
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tab-title:hover { color: var(--text-link); text-decoration: underline; }
        .tab-url {
            color: var(--text-muted);
            font-size: 11px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tab-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 4px;
            border-radius: 3px;
            opacity: 0;
            transition: all 0.15s;
        }
        .tab:hover .tab-delete { opacity: 1; }
        .tab-delete:hover { color: #C4453A; background: #1A0000; }
        .empty {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-top: 80px;
        }
        .search-bar {
            display: flex;
            margin-bottom: 16px;
        }
        .search-bar input {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text-bright);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .search-bar input:focus { border-color: var(--focus-ring); }
        .search-bar input::placeholder { color: var(--text-muted); }
        .group.hidden, .tab.hidden { display: none !important; }
    </style>


</head>
<body class="saved-tabs-page">
    <header class="page-toolbar">
        <h1 class="page-title">Saved tabs</h1>
        <div class="page-actions"><div class='search-bar page-search'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6' aria-hidden='true'><circle cx='10.5' cy='10.5' r='6.5'/><path d='m16 16 5 5'/></svg><input id='onetab-search' type='search' placeholder='Search saved tabs' aria-label='Search saved tabs' autocomplete='off' spellcheck='false'></div></div>
    </header>
    <main class="saved-tabs-content">{{CONTENT}}</main>
    <script>
    (function() {
        var input = document.getElementById('onetab-search');
        if (!input) return;
        var empty = document.createElement('p'); empty.className = 'no-results'; empty.setAttribute('role', 'status'); empty.hidden = true; empty.textContent = 'No saved tabs match your search.'; document.querySelector('.saved-tabs-content').prepend(empty);
        input.addEventListener('input', function() {
            var q = input.value.toLowerCase().trim();
            var initialEmpty = document.querySelector('.empty'); if (initialEmpty) initialEmpty.hidden = !!q;
            var groups = document.querySelectorAll('.group');
            for (var i = 0; i < groups.length; i++) {
                var g = groups[i];
                var tabs = g.querySelectorAll('.tab');
                var anyVisible = false;
                var groupMatch = ((g.querySelector('.group-name') || {}).textContent || '').toLowerCase().includes(q);
                for (var j = 0; j < tabs.length; j++) {
                    var t = tabs[j];
                    var title = (t.querySelector('.tab-title') || {}).textContent || '';
                    var url = (t.querySelector('.tab-url') || {}).textContent || '';
                    var match = !q || groupMatch || title.toLowerCase().includes(q) || url.toLowerCase().includes(q);
                    t.classList.toggle('hidden', !match);
                    if (match) anyVisible = true;
                }
                // Also check group name
                var name = (g.querySelector('.group-name') || {}).textContent || '';
                if (name.toLowerCase().includes(q)) anyVisible = true;
                g.classList.toggle('hidden', !anyVisible && q.length > 0);
            }
            empty.hidden = !q || [...groups].some(g => !g.classList.contains('hidden'));
        });
    })();
    </script>
</body>
</html>
