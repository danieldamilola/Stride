<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Error - Stride</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-dark);
            color: var(--text-bright);
            font-family: 'Segoe UI', Inter, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-icon { font-size: 64px; margin-bottom: 24px; opacity: 0.4; }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
        .message { color: #7A7A7A; font-size: 14px; max-width: 500px; text-align: center; margin-bottom: 8px; }
        .url { color: var(--text-muted); font-size: 12px; word-break: break-all; max-width: 500px; text-align: center; margin-bottom: 24px; }
        .retry-btn {
            padding: 10px 24px;
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }
        .retry-btn:hover { background: var(--button-hover); }
    </style>
    <script>
        // Self-navigate rather than postMessage: the error page runs on about:blank,
        // which the privileged-IPC gate deliberately rejects. Retrying needs no host logic.
        function retry() { location.href = decodeURIComponent("{{RETRY_URL_ENC}}"); }
    </script>


</head>
<body>
    <div class="error-icon">⚠️</div>
    <h1 class="page-title">This page can't be reached</h1>
    <p class="message">{{ERROR_MESSAGE}}</p>
    <p class="url">{{URL}}</p>
    <button class="retry-btn" onclick="retry()">Retry</button><button class="retry-btn" onclick="history.back()" style="margin-top:12px">Go back</button>
</body>
</html>
