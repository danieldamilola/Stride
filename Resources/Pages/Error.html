<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
    <meta charset="UTF-8">
    <title>Error - Stride</title>
    <style>
        :root { --accent: {{ACCENT}}; --accent-rgb: {{ACCENT_RGB}}; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-dark);
            color: var(--text-bright);
            font-family: 'Segoe UI', Inter, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-icon { font-size: 64px; margin-bottom: 24px; opacity: 0.4; }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
        .message { color: #7A7A7A; font-size: 14px; max-width: 500px; text-align: center; margin-bottom: 8px; }
        .url { color: var(--text-muted)444; font-size: 12px; word-break: break-all; max-width: 500px; text-align: center; margin-bottom: 24px; }
        .retry-btn {
            padding: 10px 24px;
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }
        .retry-btn:hover { background: var(--accent); filter: brightness(0.9); }
    </style>
    <script>
        // Self-navigate rather than postMessage: the error page runs on about:blank,
        // which the privileged-IPC gate deliberately rejects. Retrying needs no host logic.
        function retry() { location.href = decodeURIComponent("{{RETRY_URL_ENC}}"); }
    </script>
<style>
:root, :root[data-theme="dark"] {
    --bg-base: #0e0d0b;
    --bg-dark: #0e0d0b;
    --bg-surface: #141310;
    --bg-hover: #1f1d19;
    --border: var(--border);
    --text-main: var(--text-main);
    --text-bright: var(--text-bright);
    --text-muted: var(--text-muted);
    --text-dim: var(--text-dim);
    --white: var(--white);
}
:root[data-theme="light"] {
    --bg-base: #f8f8fa;
    --bg-dark: #f8f8fa;
    --bg-surface: #ffffff;
    --bg-hover: #f4f4f6;
    --border: #D4D4D2;
    --text-main: #111113;
    --text-bright: #000000;
    --text-muted: #666461;
    --text-dim: #A5A3A0;
    --white: #000000;
}
@media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
        --bg-base: #f8f8fa;
        --bg-dark: #f8f8fa;
        --bg-surface: #ffffff;
        --bg-hover: #f4f4f6;
        --border: #D4D4D2;
        --text-main: #111113;
        --text-bright: #000000;
        --text-muted: #666461;
        --text-dim: #A5A3A0;
        --white: #000000;
    }
}
</style>
<style>
:root, :root[data-theme="dark"] {
    --bg-base: #0e0d0b;
    --bg-dark: #0e0d0b;
    --bg-surface: #141310;
    --bg-hover: #1f1d19;
    --border: var(--border)333;
    --text-main: #E0E0E0;
    --text-bright: #D4D4D4;
    --text-muted: #A3A3A3;
    --text-dim: #808080;
    --white: #FFFFFF;
}
:root[data-theme="light"] {
    --bg-base: #f8f8fa;
    --bg-dark: #f8f8fa;
    --bg-surface: #ffffff;
    --bg-hover: #f4f4f6;
    --border: #D4D4D2;
    --text-main: #111113;
    --text-bright: #000000;
    --text-muted: #666461;
    --text-dim: #A5A3A0;
    --white: #000000;
}
@media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
        --bg-base: #f8f8fa;
        --bg-dark: #f8f8fa;
        --bg-surface: #ffffff;
        --bg-hover: #f4f4f6;
        --border: #D4D4D2;
        --text-main: #111113;
        --text-bright: #000000;
        --text-muted: #666461;
        --text-dim: #A5A3A0;
        --white: #000000;
    }
}
</style>
</head>
<body>
    <div class="error-icon">⚠️</div>
    <h1>This page can't be reached</h1>
    <p class="message">{{ERROR_MESSAGE}}</p>
    <p class="url">{{URL}}</p>
    <button class="retry-btn" onclick="retry()">Retry</button>
</body>
</html>
