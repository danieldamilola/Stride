<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Stride</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --base:    #111113;
            --surface: #1A1A1E;
            --border:  #2A2A2E;
            --accent:  #D4A574;
            --text:    #E8E4DF;
            --muted:   #8A8680;
            --dim:     #4A4844;
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--base);
            color: var(--text);
            font-family: 'Outfit', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            overflow: hidden;
        }

        /* ── Layout ── */
        .shell {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Drag region at top (matches WPF title bar drag) */
        .drag-bar {
            height: 36px;
            -webkit-app-region: drag;
            flex-shrink: 0;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 0 20px;
        }

        /* ── Step container ── */
        .step {
            display: none;
            width: 380px;
            animation: rise 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .step.active { display: block; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Wordmark ── */
        .wordmark {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 32px;
            opacity: 0.9;
        }

        /* ── Heading ── */
        h1 {
            font-size: 26px;
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: -0.3px;
            color: var(--text);
            margin-bottom: 10px;
        }

        .sub {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 36px;
        }

        /* ── Theme options ── */
        .theme-row {
            display: flex;
            gap: 10px;
            margin-bottom: 36px;
        }

        .theme-opt {
            flex: 1;
            padding: 14px 12px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            text-align: center;
        }

        .theme-opt:hover {
            border-color: #3A3A3E;
            background: #222226;
        }

        .theme-opt.selected {
            border-color: var(--accent);
            background: rgba(212, 165, 116, 0.08);
        }

        .theme-icon {
            font-size: 18px;
            margin-bottom: 6px;
            display: block;
        }

        .theme-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        .theme-opt.selected .theme-label {
            color: var(--accent);
        }

        /* ── Primary button ── */
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #111113;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn-primary:hover  { opacity: 0.9; }
        .btn-primary:active { transform: scale(0.99); }

        /* ── Ghost button (step 1 only) ── */
        .btn-ghost {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: transparent;
            color: var(--dim);
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }

        .btn-ghost:hover { color: var(--muted); border-color: #3A3A3E; }

        /* ── Divider ── */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 28px 0;
        }

        /* ── Step dots ── */
        .dots {
            display: flex;
            gap: 6px;
            margin-bottom: 28px;
        }

        .dot {
            width: 20px; height: 3px;
            border-radius: 2px;
            background: var(--border);
            transition: background 0.2s, width 0.2s;
        }

        .dot.active {
            background: var(--accent);
            width: 28px;
        }
    </style>
</head>
<body>
<div class="shell">
    <div class="drag-bar"></div>

    <div class="content">

        <!-- Step 1: Welcome -->
        <div id="step-1" class="step active">
            <div class="dots">
                <div class="dot active" id="dot-1"></div>
                <div class="dot" id="dot-2"></div>
            </div>
            <div class="wordmark">Stride</div>
            <h1>A browser built<br>for focus.</h1>
            <p class="sub">No bloat. No distractions.<br>Just the web, the way you want it.</p>
            <button class="btn-primary" onclick="goStep(2)">Get Started</button>
            <button class="btn-ghost" onclick="skip()">Skip setup</button>
        </div>

        <!-- Step 2: Theme -->
        <div id="step-2" class="step">
            <div class="dots">
                <div class="dot" id="dot-1b"></div>
                <div class="dot active" id="dot-2b"></div>
            </div>
            <div class="wordmark">Stride</div>
            <h1>Choose your look</h1>
            <p class="sub">Stride follows your OS by default.<br>You can change this later in Settings.</p>

            <div class="theme-row">
                <div class="theme-opt" id="opt-light" onclick="setTheme(1, this)">
                    <span class="theme-icon">☀️</span>
                    <span class="theme-label">Light</span>
                </div>
                <div class="theme-opt selected" id="opt-system" onclick="setTheme(0, this)">
                    <span class="theme-icon">💻</span>
                    <span class="theme-label">System</span>
                </div>
                <div class="theme-opt" id="opt-dark" onclick="setTheme(2, this)">
                    <span class="theme-icon">🌙</span>
                    <span class="theme-label">Dark</span>
                </div>
            </div>

            <button class="btn-primary" onclick="finish()">Start Browsing</button>
        </div>

    </div>
</div>

<script>
    var settings = Object.assign({ isFirstRun: false, appTheme: 0 }, window.initialSettings || {});
    settings.isFirstRun = false;

    function goStep(n) {
        document.querySelectorAll('.step').forEach(function(s) { s.classList.remove('active'); });
        document.getElementById('step-' + n).classList.add('active');
    }

    function setTheme(val, el) {
        settings.appTheme = val;
        document.querySelectorAll('.theme-opt').forEach(function(c) { c.classList.remove('selected'); });
        el.classList.add('selected');
    }

    function finish() {
        if (window.chrome && window.chrome.webview)
            window.chrome.webview.postMessage('save:' + JSON.stringify(settings));
    }

    function skip() {
        finish();
    }
</script>
</body>
</html>
