<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Stride</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --base:    #111113;
            --surface: #1A1A1E;
            --border:  #2A2A2E;
            --accent:  #D4A574;
            --text:    #E8E4DF;
            --muted:   #8A8680;
            --dim:     #4A4844;
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--base);
            color: var(--text);
            font-family: 'Outfit', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            overflow: hidden;
        }

        .shell {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .drag-bar {
            height: 32px;
            flex-shrink: 0;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 44px 24px;
        }

        .step {
            display: none;
            width: 100%;
            animation: rise 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .step.active { display: block; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Dots */
        .dots {
            display: flex;
            gap: 5px;
            margin-bottom: 24px;
        }

        .dot {
            height: 2px;
            width: 16px;
            border-radius: 2px;
            background: var(--border);
            transition: background 0.2s, width 0.2s;
        }

        .dot.active {
            background: var(--accent);
            width: 24px;
        }

        /* Wordmark */
        .wordmark {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 20px;
            opacity: 0.85;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            line-height: 1.25;
            letter-spacing: -0.2px;
            color: var(--text);
            margin-bottom: 8px;
        }

        .sub {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Theme options */
        .theme-row {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
        }

        .theme-opt {
            flex: 1;
            padding: 12px 8px 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            text-align: center;
        }

        .theme-opt:hover {
            border-color: #3A3A3E;
        }

        .theme-opt.selected {
            border-color: var(--accent);
            background: rgba(212, 165, 116, 0.07);
        }

        .theme-icon { font-size: 16px; margin-bottom: 5px; display: block; }

        .theme-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.03em;
        }

        .theme-opt.selected .theme-label { color: var(--accent); }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: #111113;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: opacity 0.15s;
        }

        .btn-primary:hover { opacity: 0.88; }

        .btn-skip {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 8px;
            background: transparent;
            color: var(--dim);
            border: none;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.15s;
        }

        .btn-skip:hover { color: var(--muted); }
    </style>
</head>
<body>
<div class="shell">
    <div class="drag-bar"></div>
    <div class="content">

        <!-- Step 1 -->
        <div id="step-1" class="step active">
            <div class="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
            </div>
            <div class="wordmark">Stride</div>
            <h1>A browser built<br>for focus.</h1>
            <p class="sub">No bloat. No distractions.<br>Just the web, the way you want it.</p>
            <button class="btn-primary" onclick="goStep(2)">Get Started</button>
            <button class="btn-skip" onclick="skip()">Skip setup</button>
        </div>

        <!-- Step 2 -->
        <div id="step-2" class="step">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot active"></div>
            </div>
            <div class="wordmark">Stride</div>
            <h1>Choose your look</h1>
            <p class="sub">Stride follows your OS by default.<br>Change this anytime in Settings.</p>

            <div class="theme-row">
                <div class="theme-opt" onclick="setTheme(1, this)">
                    <span class="theme-icon">☀️</span>
                    <span class="theme-label">Light</span>
                </div>
                <div class="theme-opt selected" onclick="setTheme(0, this)">
                    <span class="theme-icon">💻</span>
                    <span class="theme-label">System</span>
                </div>
                <div class="theme-opt" onclick="setTheme(2, this)">
                    <span class="theme-icon">🌙</span>
                    <span class="theme-label">Dark</span>
                </div>
            </div>

            <button class="btn-primary" onclick="finish()">Start Browsing</button>
        </div>

    </div>
</div>
<script>
    var settings = Object.assign({ isFirstRun: false, appTheme: 0 }, window.initialSettings || {});
    settings.isFirstRun = false;

    function goStep(n) {
        document.querySelectorAll('.step').forEach(function(s) { s.classList.remove('active'); });
        document.getElementById('step-' + n).classList.add('active');
    }

    function setTheme(val, el) {
        settings.appTheme = val;
        document.querySelectorAll('.theme-opt').forEach(function(c) { c.classList.remove('selected'); });
        el.classList.add('selected');
    }

    function finish() {
        if (window.chrome && window.chrome.webview)
            window.chrome.webview.postMessage('save:' + JSON.stringify(settings));
    }

    function skip() { finish(); }
</script>
</body>
</html>
