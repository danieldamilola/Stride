<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8" />
<title>Health - Stride</title>
<style>
:root { --accent: #7fb89a; --bg-base: #0f0f0f; --text-main: #e5e5e5; --card: #1a1a1a; }
body { margin:0; padding:32px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; background: var(--bg-base); color: var(--text-main); }
h1 { font-size: 20px; margin-bottom: 16px; }
.card { background: var(--card); padding: 16px; border-radius: 8px; margin-bottom: 12px; }
.label { font-size: 12px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
.value { font-size: 14px; margin-top: 4px; }
.badge { display:inline-block; padding:2px 8px; border-radius: 10px; font-size:12px; color:#fff; }
</style>
</head>
<body>
<h1>Stride Health</h1>
<div class="card">
<div class="label">Version</div>
<div class="value">{{CURRENT_VERSION}}</div>
</div>
<div class="card">
<div class="label">uBlock Origin {{EXT_VERSION}}</div>
<div class="value"><span class="badge" style="background:{{EXT_STATUS_COLOR}}">{{EXT_STATUS_TEXT}}</span> Folder: {{HAS_FOLDER}} Zip: {{HAS_ZIP}} Hash: {{HAS_HASH}}</div>
<div class="value">Zip: {{EXT_ZIP_TEXT}} Hash: {{EXT_HASH_TEXT}} Assets: {{EXT_ASSETS_TEXT}}</div>
</div>
<div class="card">
<div class="label">Assets</div>
<div class="value">Stripped: {{ASSETS_STRIPPED}}</div>
</div>
<script>window.__STRIDE_IPC_TOKEN__ = "{{IPC_TOKEN}}";</script>
</body>
</html>
