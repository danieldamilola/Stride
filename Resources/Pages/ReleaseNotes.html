<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's new - Stride</title>
<style>
:root { color-scheme:dark; --bg-base:#111; --bg-surface:#202020; --bg-hover:#292929; --border:#343434; --text-main:#eee; --text-muted:#aaa; --solid:#eee; --on-solid:#171717; }
:root[data-theme="light"] { color-scheme:light; --bg-base:#f9f9f9; --bg-dark:#f9f9f9; --bg-surface:#ffffff; --bg-hover:#e8e8e8; --bg-card:#ffffff; --card:#ffffff; --border:#d9d9d9; --border-subtle:#e8e8e8; --control-border:#8d8d8d; --text-main:#202020; --text-bright:#202020; --text-muted:#5f5f5f; --text-dim:#5f5f5f; --white:#202020; --solid:#202020; --on-solid:#ffffff; --text-link:#3a3a3a; --download-progress:#646464; --danger-text:#b42318; }
@media(prefers-color-scheme:light) { :root[data-theme="system"] { color-scheme:light; --bg-base:#f9f9f9; --bg-dark:#f9f9f9; --bg-surface:#ffffff; --bg-hover:#e8e8e8; --bg-card:#ffffff; --card:#ffffff; --border:#d9d9d9; --border-subtle:#e8e8e8; --control-border:#8d8d8d; --text-main:#202020; --text-bright:#202020; --text-muted:#5f5f5f; --text-dim:#5f5f5f; --white:#202020; --solid:#202020; --on-solid:#ffffff; --text-link:#3a3a3a; --download-progress:#646464; --danger-text:#b42318; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg-base); color:var(--text-main); font:14px "Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
button { font:inherit; cursor:pointer; color:inherit; }
button:focus-visible,summary:focus-visible { outline:2px solid var(--text-main); outline-offset:4px; }
.header { max-width:1120px; margin:auto; padding:28px 40px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
.brand { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600; }
.brand img { width:28px; height:28px; }
.installed { font-size:12px; color:var(--text-muted); }
.shell { max-width:1040px; padding:34px 40px 48px; margin:auto; }
.hero { padding:0 0 34px; border-bottom:1px solid var(--border); }
.eyebrow { font-size:12px; color:var(--text-muted); margin:0 0 14px; }
h1 { font-weight:600; font-size:44px; line-height:1.14; letter-spacing:-1.3px; margin:0; }
.hero-copy { max-width:550px; font-size:14px; color:var(--text-muted); line-height:1.7; margin:16px 0 0; }
.hero-meta { display:flex; gap:10px; align-items:center; margin-top:22px; font-size:12px; color:var(--text-muted); }
.build-tag { padding:5px 9px; border:1px solid var(--border); border-radius:5px; color:var(--text-main); }
.release-layout { display:grid; grid-template-columns:160px minmax(0,1fr); gap:48px; padding:34px 0; }
.release-sidebar { position:sticky; top:28px; align-self:start; }
.release-sidebar h2 { margin:0 0 12px 8px; font-weight:500; font-size:12px; color:var(--text-muted); }
.release-nav { display:flex; flex-direction:column; gap:6px; }
.release-nav button { text-align:left; padding:9px 10px; border:0; background:none; border-radius:6px; font-size:12px; color:var(--text-muted); }
.release-nav button:first-child { color:var(--text-main); background:var(--bg-surface); }
.release-nav button:hover { color:var(--text-main); background:var(--bg-hover); }
.release-sidebar:has(.release-nav:empty) { display:none; }
.release-layout:has(.release-nav:empty) { grid-template-columns:1fr; }
.release-content { min-width:0; }
.release { border:1px solid var(--border); border-radius:12px; background:var(--bg-surface); overflow:hidden; margin-bottom:18px; scroll-margin-top:24px; }
.release-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 24px; border-bottom:1px solid var(--border); }
.release-heading h2:focus-visible { outline:none !important; }
.release-heading h2 { font-size:20px; font-weight:600; margin:0; letter-spacing:-.4px; }
.release-heading time { font-size:12px; color:var(--text-muted); }
.release-version { display:flex; gap:10px; align-items:center; }
.latest-badge { font-size:10px; font-weight:500; color:var(--text-muted); border:1px solid var(--border); border-radius:4px; padding:3px 6px; }
.release-body { padding:4px 24px 24px; }
.change-section { margin:22px 0 0; }
.change-section h3 { font-size:12px; font-weight:600; margin:0 0 10px; }
.change-section ul { margin:0; padding-left:18px; }
.change-section li { padding-left:4px; margin:8px 0; color:var(--text-muted); font-size:13px; line-height:1.7; overflow-wrap:anywhere; }
.change-section li::marker { color:var(--text-muted); }
.release-log > .release-summary { display:flex; align-items:center; gap:16px; padding:18px 24px; list-style:none; cursor:pointer; }
.release-summary::-webkit-details-marker { display:none; }
.release-summary .older-version { font-size:15px; font-weight:500; }
.release-summary time { margin-left:auto; color:var(--text-muted); font-size:12px; }
.release-summary svg { width:14px; height:14px; fill:none; stroke:var(--text-muted); stroke-width:1.5; transition:transform .15s; }
.release-log[open] > .release-summary { border-bottom:1px solid var(--border); }
.release-log[open] > .release-summary svg { transform:rotate(180deg); }
.release-summary:hover { background:var(--bg-hover); }
.empty-release { padding:30px 32px; border:1px solid var(--border); border-radius:12px; background:var(--bg-surface); }
.empty-mark { width:42px; height:42px; display:grid; place-items:center; border:1px solid var(--border); border-radius:10px; margin-bottom:22px; }
.empty-mark svg { width:22px; height:22px; fill:none; stroke:var(--text-muted); stroke-width:1.4; }
.empty-release h2 { font-size:22px; font-weight:600; margin:0 0 12px; letter-spacing:-.4px; }
.empty-release p { margin:0; max-width:530px; color:var(--text-muted); font-size:13px; line-height:1.8; }
.footer { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-top:24px; border-top:1px solid var(--border); }
.footer-note { margin:0; font-size:12px; color:var(--text-muted); }
.footer-actions { display:flex; align-items:center; gap:10px; }
.secondary { padding:10px 12px; border:0; background:none; border-radius:7px; color:var(--text-muted); }
.secondary:hover { background:var(--bg-hover); color:var(--text-main); }
.primary { display:flex; align-items:center; gap:12px; background:var(--solid); color:var(--on-solid); border:1px solid var(--solid); border-radius:7px; padding:10px 16px; font-size:13px; font-weight:600; white-space:nowrap; }
.primary:hover { opacity:.88; }.primary svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.5; }
@media(max-width:800px) { .header { padding:22px 24px; }.shell { padding:24px 24px 32px; }.release-layout { grid-template-columns:1fr; gap:20px; }.release-sidebar { position:static; }.release-sidebar h2 { display:none; }.release-nav { flex-direction:row; flex-wrap:wrap; } h1 { font-size:36px; }.footer { align-items:flex-start; flex-direction:column; }.footer-actions { align-self:flex-end; } }
@media(max-width:480px) { .header { padding:16px; }.shell { padding:20px 16px 28px; } h1 { font-size:32px; }.release-heading { padding:18px; align-items:flex-start; flex-direction:column; gap:8px; }.release-body { padding:0 18px 18px; }.release-log > .release-summary { padding:16px 18px; }.empty-release { padding:24px; }.footer-actions { width:100%; justify-content:space-between; }.installed { font-size:11px; } }
@media(prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header class="header"><div class="brand"><img src="{{APP_ICON}}" alt="">Stride</div><span class="installed">Version {{VERSION}}</span></header>
<div class="shell">
<section class="hero" aria-labelledby="pageTitle"><p class="eyebrow">Updates</p><h1 id="pageTitle">What's new in Stride.</h1><p class="hero-copy">A record of the features, changes and fixes in each release.</p><div class="hero-meta"><span class="build-tag">{{RELEASE_STATUS}}</span></div></section>
<main class="release-layout"><aside class="release-sidebar"><h2>Release history</h2><nav class="release-nav" aria-label="Release history">{{RELEASE_NAV_HTML}}</nav></aside><div class="release-content">{{ALL_RELEASES_HTML}}</div></main>
<footer class="footer"><p class="footer-note">Find this page again in Settings, under About.</p><div class="footer-actions"><button class="secondary" id="settingsBtn">Settings</button><button class="primary" id="continueBtn">Continue browsing<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></footer>
</div>
<script>
const __T = '{{IPC_TOKEN}}:';
function post(message) { window.chrome?.webview?.postMessage(__T + message); }
document.getElementById('continueBtn').addEventListener('click',()=>post('whatsnew-continue'));
document.getElementById('settingsBtn').addEventListener('click',()=>post('whatsnew-dismiss'));
for (const button of document.querySelectorAll('[data-release]')) button.addEventListener('click',()=>{
    const section=document.getElementById(button.dataset.release); if (!section) return;
    if (section.tagName==='DETAILS') section.open=true;
    section.scrollIntoView({block:'start',behavior:'instant'});
    const heading=section.querySelector('h2,summary'); if (heading) { heading.setAttribute('tabindex','-1'); heading.focus({preventScroll:true}); }
});
</script>
</body>
</html>
