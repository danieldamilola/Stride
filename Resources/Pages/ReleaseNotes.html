<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8">
<title>What's New in Stride</title>
<style>
  :root { 
    --accent: {{ACCENT}}; 
    --accent-rgb: {{ACCENT_RGB}}; 
  }
  :root, :root[data-theme="dark"] {
    --bg-base: #0e0d0b;
    --bg-surface: #141310;
    --bg-card: #181714;
    --bg-hover: #1f1d19;
    --border: rgba(255, 255, 255, 0.08);
    --border-subtle: rgba(255, 255, 255, 0.04);
    --text-main: #e0e0e0;
    --text-bright: #d4d4d4;
    --text-muted: #a3a3a3;
    --text-dim: #808080;
  }
  :root[data-theme="light"] {
    --bg-base: #f8f8fa;
    --bg-surface: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: #f4f4f6;
    --border: rgba(0, 0, 0, 0.08);
    --border-subtle: rgba(0, 0, 0, 0.04);
    --text-main: #18181b;
    --text-bright: #09090b;
    --text-muted: #71717a;
    --text-dim: #a1a1aa;
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
      --bg-base: #f8f8fa;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f4f4f6;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text-main: #18181b;
      --text-bright: #09090b;
      --text-muted: #71717a;
      --text-dim: #a1a1aa;
      --fix-color: #be123c;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg-base);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-y: auto;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .shell {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 36px 40px 60px;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text-main);
    opacity: 0.9;
  }
  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .badge {
    font-size: 11px;
    font-family: monospace;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  /* ── Hero Stage ── */
  .stage {
    padding: 36px 0 28px;
  }
  .eyebrow {
    font-size: 11px;
    font-family: monospace;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 500;
  }
  h1 {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1.08;
    color: var(--text-bright);
  }
  .sub {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
    margin-top: 14px;
  }

  /* ── Hero Highlight Card ── */
  .hero-card {
    margin-top: 28px;
    padding: 20px 22px;
    background: rgba(var(--accent-rgb), 0.05);
    border: 1px solid rgba(var(--accent-rgb), 0.22);
    border-radius: 14px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    transition: border-color 0.15s;
  }
  .hero-card:hover {
    border-color: rgba(var(--accent-rgb), 0.4);
  }
  .hero-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(var(--accent-rgb), 0.15);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .hero-icon svg {
    width: 18px;
    height: 18px;
  }
  .hero-info {
    flex: 1;
    min-width: 0;
  }
  .hero-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .hero-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: -0.01em;
  }
  .hero-badge {
    font-size: 10px;
    font-family: monospace;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--accent);
    color: #0e0d0b;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .hero-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.55;
    margin-top: 6px;
  }

  /* ── Release Log ── */
  .release-log {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--border-subtle);
  }
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .log-version {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-bright);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .log-version-icon {
    width: 18px;
    height: 18px;
    color: var(--accent);
  }
  .log-date {
    font-size: 12px;
    font-family: monospace;
    font-weight: 500;
    color: var(--text-muted);
  }

  .changelog-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .changelog-item {
    display: flex;
    gap: 16px;
    align-items: baseline;
  }
  .changelog-tag {
    font-size: 12px;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 0.04em;
    min-width: 52px;
    flex-shrink: 0;
  }
  .changelog-tag.feature { color: var(--accent); }
  :root, :root[data-theme="dark"] { --fix-color: #f43f5e; }
  :root[data-theme="light"] { --fix-color: #be123c; }

  .changelog-tag.fix { color: var(--fix-color); }
  
  .changelog-content {
    flex: 1;
    min-width: 0;
  }
  .changelog-title {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text-bright);
    margin-bottom: 2px;
  }
  .changelog-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* ── Up to date Notice ── */
  .status-box {
    margin-top: 28px;
    padding: 14px 18px;
    background: rgba(var(--accent-rgb), 0.04);
    border: 1px solid rgba(var(--accent-rgb), 0.15);
    border-radius: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .status-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--accent);
    color: #0e0d0b;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 700;
    font-size: 12px;
  }
  .status-text {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.45;
  }
  .status-text strong {
    color: var(--text-bright);
    font-weight: 500;
  }

  /* ── Footer ── */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 0 0;
    border-top: 1px solid var(--border-subtle);
    margin-top: 36px;
  }
  .primary {
    background: var(--accent);
    color: #0e0d0b;
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 24px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .primary:hover { opacity: 0.9; }
  .primary:active { transform: scale(0.97); }
  .ghost {
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    transition: color 0.15s;
    padding: 8px 14px;
    border-radius: 6px;
  }
  .ghost:hover {
    color: var(--text-main);
    background: var(--bg-hover);
  }
</style>
</head>

  <main class="stage">


    <!-- Full changelog -->
    {{ALL_RELEASES_HTML}}

    <!-- Status Box -->
    <div class="status-box">
      <div class="status-icon">&#10003;</div>
      <div class="status-text">
        <strong>You're all set.</strong> Find full update history anytime in Settings &gt; About.
      </div>
    </div>
  </main>

  <footer class="foot">
    <button class="ghost" onclick="post('whatsnew-dismiss')">Settings</button>
    <button class="primary" onclick="post('whatsnew-continue')">
      Continue to Stride 
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M5 2.5L9.5 7 5 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </footer>
</div>

<script>
  const __T = '{{IPC_TOKEN}}:';
  const post = (msg) => {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(__T + msg);
    }
  };
</script>
