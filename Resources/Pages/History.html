<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>History - Spur</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0C0C0C;
            color: #D4D4D4;
            font-family: 'Segoe UI', Inter, sans-serif;
            padding: 24px 32px;
        }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 20px; }
        .group { margin-bottom: 24px; }
        .group-header {
            font-size: 14px;
            font-weight: 600;
            color: #7A7A7A;
            padding: 8px 0;
            border-bottom: 1px solid #1E1E1E;
            margin-bottom: 4px;
        }
        .tab {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .tab:hover { background: #222222; }
        .tab-main { flex: 1; min-width: 0; }
        .tab-title {
            color: #D4D4D4;
            text-decoration: none;
            font-size: 13px;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tab-title:hover { color: #D4A574; }
        .tab-url {
            color: #444444;
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }
        .entry-time {
            color: #444444;
            font-size: 11px;
            margin-left: 12px;
            white-space: nowrap;
        }
        .empty {
            color: #444444;
            font-size: 14px;
            text-align: center;
            margin-top: 80px;
        }
    </style>
</head>
<body>
    <h1>History</h1>
    {{CONTENT}}
</body>
</html>
