<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
    <meta charset="UTF-8">
    <title>History - Stride</title>
    <style>
        :root { --accent: {{ACCENT}}; --accent-rgb: {{ACCENT_RGB}}; }

        :root, :root[data-theme="dark"] {
            --bg-base: #0e0d0b;
            --bg-surface: #141310;
            --bg-hover: #1f1d19;
            --border: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.04);
            --text-bright: #f4f4f5;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
            --text-dim: #71717a;
        }
        :root[data-theme="light"] {
            --bg-base: #f8f8fa;
            --bg-surface: #ffffff;
            --bg-hover: #f4f4f6;
            --border: rgba(0, 0, 0, 0.08);
            --border-subtle: rgba(0, 0, 0, 0.04);
            --text-bright: #09090b;
            --text-main: #18181b;
            --text-muted: #71717a;
            --text-dim: #a1a1aa;
        }
        @media (prefers-color-scheme: light) {
            :root[data-theme="system"] {
                --bg-base: #f8f8fa;
                --bg-surface: #ffffff;
                --bg-hover: #f4f4f6;
                --border: rgba(0, 0, 0, 0.08);
                --border-subtle: rgba(0, 0, 0, 0.04);
                --text-bright: #09090b;
                --text-main: #18181b;
                --text-muted: #71717a;
                --text-dim: #a1a1aa;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        button { font-family: inherit; cursor: pointer; }

        /* ── Toolbar ── */
        .toolbar {
            padding: 8px 20px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            height: 48px;
        }
        .toolbar h1 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-bright);
        }
        .toolbar-spacer { flex: 1; }
        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Search bar ── */
        .search-bar { position: relative; }
        .search-bar input {
            width: 240px;
            padding: 5px 12px 5px 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-bright);
            font-size: 11.5px;
            font-family: inherit;
            outline: none;
            transition: border-color 150ms;
        }
        .search-bar input:focus { border-color: rgba(var(--accent-rgb), 0.4); }
        .search-bar input::placeholder { color: var(--text-dim); }
        .search-bar svg {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            color: var(--text-dim);
            pointer-events: none;
        }

        /* ── Toolbar buttons ── */
        .icon-btn {
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 11.5px;
            transition: background 150ms, color 150ms, border-color 150ms;
        }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text-main); }
        .icon-btn.danger:hover { background: rgba(229, 80, 80, 0.08); border-color: rgba(229, 80, 80, 0.3); color: #E55050; }

        /* ── Main Content ── */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
        }
        .list-inner {
            max-width: 680px;
            margin: 0 auto;
        }

        /* ── Date sections ── */
        .date-section { margin-bottom: 8px; }

        .date-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background 150ms;
        }
        .date-header:hover { background: var(--bg-hover); }
        .date-chevron {
            width: 12px;
            height: 12px;
            transition: transform 200ms ease;
            flex-shrink: 0;
            color: var(--text-muted);
        }
        .date-section.collapsed .date-chevron { transform: rotate(-90deg); }
        .date-section.collapsed .date-body { display: none; }
        
        .date-body {
            padding-left: 20px;
            padding-top: 4px;
            padding-bottom: 12px;
        }

        /* ── Domain groups ── */
        .domain-group { margin-bottom: 2px; }
        .domain-group.collapsed .date-chevron { transform: rotate(-90deg); }
        .domain-group.collapsed .domain-entries { display: none; }
        .domain-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            border-radius: 6px;
            user-select: none;
            cursor: pointer;
            transition: background 150ms;
        }
        .domain-header:hover { background: var(--bg-hover); }
        .domain-header img {
            width: 15px;
            height: 15px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .domain-name {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-bright);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── Individual entries ── */
        .entry {
            display: flex;
            align-items: center;
            padding: 5px 10px 5px 34px;
            border-radius: 6px;
            transition: background 150ms;
        }
        .entry:hover { background: var(--bg-hover); }
        .entry-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .entry-title {
            color: var(--text-main);
            text-decoration: none;
            font-size: 12.5px;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }
        .entry-title:hover { color: var(--accent); text-decoration: underline; }
        .entry-url {
            color: var(--text-dim);
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }
        .entry-time {
            color: var(--text-dim);
            font-size: 11px;
            margin-left: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ── Empty state ── */
        .empty {
            color: var(--text-dim);
            font-size: 13px;
            text-align: center;
            margin-top: 80px;
        }

        /* ── Confirm dialog ── */
        .dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .dialog-overlay.open { display: flex; }
        .dialog {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            width: 320px;
        }
        .dialog h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 8px;
        }
        .dialog p {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .dialog-actions button {
            padding: 7px 16px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 12.5px;
            font-family: inherit;
            cursor: pointer;
            transition: background 150ms, color 150ms;
        }
        .dialog-actions button:hover { background: var(--bg-hover); color: var(--text-bright); }
        .dialog-actions button.danger {
            background: rgba(229, 80, 80, 0.08);
            border-color: rgba(229, 80, 80, 0.3);
            color: #E55050;
        }
        .dialog-actions button.danger:hover { background: rgba(229, 80, 80, 0.16); }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>History</h1>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-actions">
            <div class="search-bar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search history...">
            </div>
            <button class="icon-btn" id="collapseAllBtn">Expand all</button>
            <button class="icon-btn danger" id="clearBtn">Clear all</button>
        </div>
    </div>

    <div class="main">
        <div class="list-inner" id="historyContent"></div>
    </div>

    <div class="dialog-overlay" id="confirmDialog">
        <div class="dialog">
            <h3>Clear browsing history?</h3>
            <p>This will permanently delete all your browsing history. This action cannot be undone.</p>
            <div class="dialog-actions">
                <button onclick="closeConfirm()">Cancel</button>
                <button class="danger" onclick="confirmClear()">Clear all</button>
            </div>
        </div>
    </div>

    <script type="application/json" id="historyData">{{ENTRIES}}</script>
    <script>
        const __T = '{{IPC_TOKEN}}:';
        let entries = [];
        try { entries = JSON.parse(document.getElementById('historyData').textContent || '[]'); } catch {}

        function getDomain(url) {
            try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
        }

        function getDomainLabel(domain) {
            const parts = domain.replace(/\.(com|org|net|io|co|dev|ai|app|me|tv|gg|xyz)$/i, '').split('.');
            return parts.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const entryDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const diffDays = Math.floor((today - entryDate) / 86400000);
            if (diffDays === 0) return 'TODAY';
            if (diffDays === 1) return 'YESTERDAY';
            if (diffDays < 7) return d.toLocaleDateString(undefined, { weekday: 'long' }).toUpperCase();
            return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase();
        }

        function formatTime(dateStr) {
            return new Date(dateStr).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        const dateChevronSvg = `<svg class="date-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>`;

        function render(filter = '') {
            const container = document.getElementById('historyContent');
            const lowerFilter = filter.toLowerCase();
            const filtered = filter
                ? entries.filter(e => (e.Title || '').toLowerCase().includes(lowerFilter) || (e.Url || '').toLowerCase().includes(lowerFilter))
                : entries;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty">${filter ? 'No results found.' : 'No browsing history yet.'}</div>`;
                return;
            }

            const sorted = [...filtered].sort((a, b) => new Date(b.VisitedAt) - new Date(a.VisitedAt));

            const byDate = {};
            sorted.forEach(e => {
                const key = formatDate(e.VisitedAt);
                if (!byDate[key]) byDate[key] = [];
                byDate[key].push(e);
            });

            let html = '';

            for (const [dateLabel, dateEntries] of Object.entries(byDate)) {
                const dateSectionId = `date-${dateLabel}`.replace(/[^a-zA-Z0-9]/g, '_');

                const byDomain = {};
                dateEntries.forEach(e => {
                    const domain = getDomain(e.Url);
                    if (!byDomain[domain]) byDomain[domain] = [];
                    byDomain[domain].push(e);
                });

                html += `<div class="date-section collapsed" id="${dateSectionId}">
                    <div class="date-header" onclick="toggleDate('${dateSectionId}')">
                        ${dateChevronSvg}
                        ${escapeHtml(dateLabel)}
                    </div>
                    <div class="date-body">`;

                for (const [domain, domainEntries] of Object.entries(byDomain)) {
                    const label = getDomainLabel(domain);
                    const groupId = `g-${dateLabel}-${domain}`.replace(/[^a-zA-Z0-9]/g, '_');

                    if (domainEntries.length === 1) {
                        const e = domainEntries[0];
                        const title = e.Title || e.Url;
                        html += `<div class="entry">
                            <img src="https://icons.duckduckgo.com/ip3/${domain}.ico" width="15" height="15"
                                 onerror="this.style.display='none'" style="margin-right:8px;border-radius:3px;flex-shrink:0">
                            <div class="entry-main">
                                <a class="entry-title" onclick="openUrl('${escapeHtml(e.Url)}')">${escapeHtml(title)}</a>
                                <span class="entry-url">${escapeHtml(e.Url)}</span>
                            </div>
                            <span class="entry-time">${formatTime(e.VisitedAt)}</span>
                        </div>`;
                    } else {
                        html += `<div class="domain-group collapsed" id="${groupId}">
                            <div class="domain-header" onclick="toggleGroup('${groupId}')">
                                <img src="https://icons.duckduckgo.com/ip3/${domain}.ico" width="15" height="15"
                                     onerror="this.style.display='none'">
                                <span class="domain-name">${escapeHtml(label)}</span>
                                ${dateChevronSvg}
                            </div>
                            <div class="domain-entries">`;

                        domainEntries.forEach(e => {
                            const title = e.Title || e.Url;
                            html += `<div class="entry">
                                <div class="entry-main">
                                    <a class="entry-title" onclick="openUrl('${escapeHtml(e.Url)}')">${escapeHtml(title)}</a>
                                    <span class="entry-url">${escapeHtml(e.Url)}</span>
                                </div>
                                <span class="entry-time">${formatTime(e.VisitedAt)}</span>
                            </div>`;
                        });

                        html += `</div></div>`;
                    }
                }

                html += `</div></div>`;
            }

            container.innerHTML = html;
            updateCollapseBtnState();
        }

        function toggleDate(id) {
            document.getElementById(id)?.classList.toggle('collapsed');
            updateCollapseBtnState();
        }

        function toggleGroup(id) {
            document.getElementById(id)?.classList.toggle('collapsed');
        }

        function updateCollapseBtnState() {
            const sections = document.querySelectorAll('.date-section');
            const anyOpen = [...sections].some(s => !s.classList.contains('collapsed'));
            document.getElementById('collapseAllBtn').textContent = anyOpen ? 'Collapse all' : 'Expand all';
        }

        function openUrl(url) {
            window.chrome.webview.postMessage(__T + 'history-open:' + url);
        }

        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            const sections = document.querySelectorAll('.date-section');
            const anyOpen = [...sections].some(s => !s.classList.contains('collapsed'));
            sections.forEach(s => {
                if (anyOpen) s.classList.add('collapsed');
                else s.classList.remove('collapsed');
            });
            updateCollapseBtnState();
        });

        document.getElementById('searchInput').addEventListener('input', e => render(e.target.value));

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('confirmDialog').classList.add('open');
        });

        function closeConfirm() {
            document.getElementById('confirmDialog').classList.remove('open');
        }

        function confirmClear() {
            window.chrome.webview.postMessage(__T + 'history-clear');
            closeConfirm();
        }

        document.getElementById('confirmDialog').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeConfirm();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeConfirm();
        });

        render();
    </script>
</body>
</html>
